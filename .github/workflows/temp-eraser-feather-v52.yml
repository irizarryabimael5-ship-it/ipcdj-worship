name: One-time eraser feather v52

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-eraser-feather-v52.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply soft eraser-style seam feather
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          if 'content="seamless-person-v51"' not in s:
              raise SystemExit('expected v51 build marker not found')
          s=s.replace('content="seamless-person-v51"','content="eraser-feather-v52"',1)

          old_desktop=r'''      /\* Professional-composite style feather: one continuous alpha mask instead of\n         additive masks, so there is no rectangular seam where the subject layer begins\. \*/\n      -webkit-mask-image:linear-gradient\(90deg,\n        transparent 0%,\n        rgba\(0,0,0,\.025\) 7%,\n        rgba\(0,0,0,\.08\) 14%,\n        rgba\(0,0,0,\.18\) 22%,\n        rgba\(0,0,0,\.34\) 31%,\n        rgba\(0,0,0,\.54\) 40%,\n        rgba\(0,0,0,\.72\) 49%,\n        rgba\(0,0,0,\.86\) 57%,\n        rgba\(0,0,0,\.95\) 64%,\n        #000 72%,\n        #000 100%\);\n      mask-image:linear-gradient\(90deg,\n        transparent 0%,\n        rgba\(0,0,0,\.025\) 7%,\n        rgba\(0,0,0,\.08\) 14%,\n        rgba\(0,0,0,\.18\) 22%,\n        rgba\(0,0,0,\.34\) 31%,\n        rgba\(0,0,0,\.54\) 40%,\n        rgba\(0,0,0,\.72\) 49%,\n        rgba\(0,0,0,\.86\) 57%,\n        rgba\(0,0,0,\.95\) 64%,\n        #000 72%,\n        #000 100%\);\n      -webkit-mask-repeat:no-repeat;\n      mask-repeat:no-repeat;'''

          new_desktop='''      /* Eraser-style blend: intentionally keep the entire seam zone partially erased.
         The subject does not become fully opaque until the far-right side, so there is no
         single vertical point where the duplicate artwork visibly starts. */
      -webkit-mask-image:linear-gradient(90deg,
        transparent 0%,
        transparent 10%,
        rgba(0,0,0,.03) 18%,
        rgba(0,0,0,.08) 27%,
        rgba(0,0,0,.16) 36%,
        rgba(0,0,0,.28) 46%,
        rgba(0,0,0,.43) 56%,
        rgba(0,0,0,.60) 66%,
        rgba(0,0,0,.76) 75%,
        rgba(0,0,0,.88) 83%,
        rgba(0,0,0,.96) 91%,
        #000 98%,
        #000 100%);
      mask-image:linear-gradient(90deg,
        transparent 0%,
        transparent 10%,
        rgba(0,0,0,.03) 18%,
        rgba(0,0,0,.08) 27%,
        rgba(0,0,0,.16) 36%,
        rgba(0,0,0,.28) 46%,
        rgba(0,0,0,.43) 56%,
        rgba(0,0,0,.60) 66%,
        rgba(0,0,0,.76) 75%,
        rgba(0,0,0,.88) 83%,
        rgba(0,0,0,.96) 91%,
        #000 98%,
        #000 100%);
      -webkit-mask-mode:alpha;
      mask-mode:alpha;
      -webkit-mask-repeat:no-repeat;
      mask-repeat:no-repeat;'''

          s,n=re.subn(old_desktop,new_desktop,s,count=1)
          if n!=1:
              raise SystemExit('desktop v51 mask block not found')

          old_mobile=r'''        -webkit-mask-image:linear-gradient\(90deg,\n          transparent 0%,\n          rgba\(0,0,0,\.02\) 8%,\n          rgba\(0,0,0,\.07\) 16%,\n          rgba\(0,0,0,\.17\) 25%,\n          rgba\(0,0,0,\.32\) 34%,\n          rgba\(0,0,0,\.52\) 44%,\n          rgba\(0,0,0,\.71\) 53%,\n          rgba\(0,0,0,\.86\) 61%,\n          rgba\(0,0,0,\.95\) 68%,\n          #000 76%,\n          #000 100%\);\n        mask-image:linear-gradient\(90deg,\n          transparent 0%,\n          rgba\(0,0,0,\.02\) 8%,\n          rgba\(0,0,0,\.07\) 16%,\n          rgba\(0,0,0,\.17\) 25%,\n          rgba\(0,0,0,\.32\) 34%,\n          rgba\(0,0,0,\.52\) 44%,\n          rgba\(0,0,0,\.71\) 53%,\n          rgba\(0,0,0,\.86\) 61%,\n          rgba\(0,0,0,\.95\) 68%,\n          #000 76%,\n          #000 100%\);\n        -webkit-mask-repeat:no-repeat;\n        mask-repeat:no-repeat;'''

          new_mobile='''        -webkit-mask-image:linear-gradient(90deg,
          transparent 0%,
          transparent 12%,
          rgba(0,0,0,.025) 21%,
          rgba(0,0,0,.07) 31%,
          rgba(0,0,0,.14) 41%,
          rgba(0,0,0,.26) 51%,
          rgba(0,0,0,.42) 61%,
          rgba(0,0,0,.59) 70%,
          rgba(0,0,0,.75) 78%,
          rgba(0,0,0,.88) 86%,
          rgba(0,0,0,.96) 93%,
          #000 99%,
          #000 100%);
        mask-image:linear-gradient(90deg,
          transparent 0%,
          transparent 12%,
          rgba(0,0,0,.025) 21%,
          rgba(0,0,0,.07) 31%,
          rgba(0,0,0,.14) 41%,
          rgba(0,0,0,.26) 51%,
          rgba(0,0,0,.42) 61%,
          rgba(0,0,0,.59) 70%,
          rgba(0,0,0,.75) 78%,
          rgba(0,0,0,.88) 86%,
          rgba(0,0,0,.96) 93%,
          #000 99%,
          #000 100%);
        -webkit-mask-mode:alpha;
        mask-mode:alpha;
        -webkit-mask-repeat:no-repeat;
        mask-repeat:no-repeat;'''

          s,n=re.subn(old_mobile,new_mobile,s,count=1)
          if n!=1:
              raise SystemExit('mobile v51 mask block not found')

          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text()
          if 'const CACHE_NAME = "ipcdj-worship-v51";' not in t:
              raise SystemExit('expected v51 sw marker not found')
          sw.write_text(t.replace('const CACHE_NAME = "ipcdj-worship-v51";','const CACHE_NAME = "ipcdj-worship-v52";',1))

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          note='''\n\n## Eraser-style subject seam v52\n\nThe isolated person overlay must mimic a low-opacity eraser pass along its blend edge. Do not let the duplicate artwork jump from transparent to fully opaque over a short span. The subject layer remains partially erased across most of its left-to-right transition and reaches full opacity only near the far-right edge. Explicit alpha masking is required for consistent behavior across WebKit/Safari and other browsers. This treatment is intended to eliminate the visible vertical cut line while preserving a clearly readable person.\n'''
          if '## Eraser-style subject seam v52' not in u:
              st.write_text(u+note)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Apply eraser-style feather to person overlay seam"
          git push origin main
