name: One-time eraser feather v52

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-eraser-feather-v52.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply eraser-style subject feather
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          if 'content="seamless-person-v51"' not in s:
              raise SystemExit('expected v51 build marker not found')
          s = s.replace('content="seamless-person-v51"', 'content="eraser-feather-v52"', 1)
          desktop_mask = "      -webkit-mask-image:linear-gradient(90deg,\n        transparent 0%,\n        transparent 10%,\n        rgba(0,0,0,.03) 18%,\n        rgba(0,0,0,.08) 27%,\n        rgba(0,0,0,.16) 36%,\n        rgba(0,0,0,.28) 46%,\n        rgba(0,0,0,.43) 56%,\n        rgba(0,0,0,.60) 66%,\n        rgba(0,0,0,.76) 75%,\n        rgba(0,0,0,.88) 83%,\n        rgba(0,0,0,.96) 91%,\n        #000 98%,\n        #000 100%);\n      mask-image:linear-gradient(90deg,\n        transparent 0%,\n        transparent 10%,\n        rgba(0,0,0,.03) 18%,\n        rgba(0,0,0,.08) 27%,\n        rgba(0,0,0,.16) 36%,\n        rgba(0,0,0,.28) 46%,\n        rgba(0,0,0,.43) 56%,\n        rgba(0,0,0,.60) 66%,\n        rgba(0,0,0,.76) 75%,\n        rgba(0,0,0,.88) 83%,\n        rgba(0,0,0,.96) 91%,\n        #000 98%,\n        #000 100%);\n      -webkit-mask-mode:alpha;\n      mask-mode:alpha;\n      -webkit-mask-repeat:no-repeat;\n      mask-repeat:no-repeat;"
          mobile_mask = "        -webkit-mask-image:linear-gradient(90deg,\n          transparent 0%,\n          transparent 12%,\n          rgba(0,0,0,.025) 21%,\n          rgba(0,0,0,.07) 31%,\n          rgba(0,0,0,.14) 41%,\n          rgba(0,0,0,.26) 51%,\n          rgba(0,0,0,.42) 61%,\n          rgba(0,0,0,.59) 70%,\n          rgba(0,0,0,.75) 78%,\n          rgba(0,0,0,.88) 86%,\n          rgba(0,0,0,.96) 93%,\n          #000 99%,\n          #000 100%);\n        mask-image:linear-gradient(90deg,\n          transparent 0%,\n          transparent 12%,\n          rgba(0,0,0,.025) 21%,\n          rgba(0,0,0,.07) 31%,\n          rgba(0,0,0,.14) 41%,\n          rgba(0,0,0,.26) 51%,\n          rgba(0,0,0,.42) 61%,\n          rgba(0,0,0,.59) 70%,\n          rgba(0,0,0,.75) 78%,\n          rgba(0,0,0,.88) 86%,\n          rgba(0,0,0,.96) 93%,\n          #000 99%,\n          #000 100%);\n        -webkit-mask-mode:alpha;\n        mask-mode:alpha;\n        -webkit-mask-repeat:no-repeat;\n        mask-repeat:no-repeat;"
          start = s.index('    .current .cover-subject-detail{', s.index('.current .cover-edge-detail::after'))
          end = s.index('    .current .countdown-wrap,', start)
          block = s[start:end]
          block, n = re.subn(r'      /\* Professional-composite style feather:.*?      mask-repeat:no-repeat;', desktop_mask, block, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('desktop mask block not found')
          s = s[:start] + block + s[end:]
          media = s.index('@media (max-width:640px)', end)
          mstart = s.index('      .current .cover-subject-detail{', media)
          mend = s.index('      .current .cover-edge-detail{', mstart)
          mblock = s[mstart:mend]
          mblock, n = re.subn(r'        -webkit-mask-image:linear-gradient\(90deg,.*?        mask-repeat:no-repeat;', mobile_mask, mblock, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('mobile mask block not found')
          s = s[:mstart] + mblock + s[mend:]
          p.write_text(s)
          sw = Path('sw.js')
          t = sw.read_text()
          if 'const CACHE_NAME = "ipcdj-worship-v51";' not in t:
              raise SystemExit('expected v51 service-worker marker not found')
          sw.write_text(t.replace('const CACHE_NAME = "ipcdj-worship-v51";', 'const CACHE_NAME = "ipcdj-worship-v52";', 1))
          st = Path('SITE_STANDARDS.md')
          u = st.read_text()
          note = "\n\n## Eraser-style subject seam v52\n\nThe isolated person overlay uses a deliberately low-opacity feather across most of its blend boundary, mimicking a soft eraser pass. The duplicate artwork must not become fully opaque until the far-right side of the subject region. Explicit alpha mask mode is used for cross-browser consistency. The goal is to erase the visible vertical cut line while preserving the person as a clear foreground subject.\n"
          if '## Eraser-style subject seam v52' not in u:
              st.write_text(u + note)
          PY
          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Apply eraser-style feather to person overlay seam"
          git push origin main
