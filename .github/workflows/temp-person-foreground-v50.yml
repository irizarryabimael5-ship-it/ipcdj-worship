name: One-time foreground person v50

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-person-foreground-v50.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Put isolated person above centered album background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          if 'content="person-isolation-v49"' not in s:
              raise SystemExit('expected v49 build marker not found')
          s=s.replace('content="person-isolation-v49"','content="person-foreground-v50"',1)

          # Keep every base artwork layer underneath the isolated subject.
          s=s.replace('''    .current > :not(.cover-detail):not(.cover-edge-detail):not(.cover-subject-detail){\n      z-index:2;\n    }''','''    .current > :not(.cover-detail):not(.cover-edge-detail):not(.cover-subject-detail){\n      z-index:3;\n    }''',1)

          # Make the subject unmistakably foreground relative to all album-art layers.
          s=s.replace('''      z-index:1;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:var(--subject-bg-size) auto;''','''      z-index:2;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:var(--subject-bg-size) auto;''',1)

          # Restore a broader approved person reveal, but feather the layer boundaries heavily.
          subject_pattern=r'''    \.current \.cover-subject-detail\{\n      position:absolute;\n      top:0;\n      right:0;\n      width:var\(--subject-width\);\n      height:var\(--subject-height\);\n      z-index:2;.*?\n    \}\n\n    \.current \.countdown-wrap,'''
          subject_replacement='''    .current .cover-subject-detail{\n      position:absolute;\n      top:0;\n      right:0;\n      width:var(--subject-width);\n      height:var(--subject-height);\n      z-index:2;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:var(--subject-bg-size) auto;\n      background-position:var(--subject-bg-x) var(--subject-bg-y);\n      background-repeat:no-repeat;\n      filter:blur(.04px) saturate(1.16) contrast(1.08);\n      -webkit-filter:blur(.04px) saturate(1.16) contrast(1.08);\n      opacity:var(--subject-opacity);\n      transform:none;\n      transform-origin:top right;\n      -webkit-mask-image:\n        linear-gradient(90deg, transparent 0%, rgba(0,0,0,.08) 6%, rgba(0,0,0,.34) 12%, rgba(0,0,0,.78) 20%, #000 30%, #000 100%),\n        linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,.72) 8%, #000 16%, #000 87%, rgba(0,0,0,.64) 94%, rgba(0,0,0,.12) 100%),\n        radial-gradient(ellipse 42% 29% at 77% 22%, #000 0%, #000 49%, rgba(0,0,0,.94) 60%, rgba(0,0,0,.68) 72%, rgba(0,0,0,.30) 84%, rgba(0,0,0,.08) 94%, transparent 100%),\n        radial-gradient(ellipse 39% 49% at 75% 61%, #000 0%, #000 44%, rgba(0,0,0,.92) 56%, rgba(0,0,0,.64) 70%, rgba(0,0,0,.28) 84%, rgba(0,0,0,.08) 94%, transparent 100%);\n      mask-image:\n        linear-gradient(90deg, transparent 0%, rgba(0,0,0,.08) 6%, rgba(0,0,0,.34) 12%, rgba(0,0,0,.78) 20%, #000 30%, #000 100%),\n        linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,.72) 8%, #000 16%, #000 87%, rgba(0,0,0,.64) 94%, rgba(0,0,0,.12) 100%),\n        radial-gradient(ellipse 42% 29% at 77% 22%, #000 0%, #000 49%, rgba(0,0,0,.94) 60%, rgba(0,0,0,.68) 72%, rgba(0,0,0,.30) 84%, rgba(0,0,0,.08) 94%, transparent 100%),\n        radial-gradient(ellipse 39% 49% at 75% 61%, #000 0%, #000 44%, rgba(0,0,0,.92) 56%, rgba(0,0,0,.64) 70%, rgba(0,0,0,.28) 84%, rgba(0,0,0,.08) 94%, transparent 100%);\n      -webkit-mask-composite:source-over;\n      mask-composite:add;\n      transition:opacity .8s ease;\n      will-change:opacity;\n    }\n\n    .current .countdown-wrap,'''
          s,n=re.subn(subject_pattern,subject_replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('desktop person block replacement failed')

          mobile_pattern=r'''      \.current \.cover-subject-detail\{\n        top:0;\n        right:0;\n        width:38%;\n        height:31%;.*?\n      \}\n\n      \.current \.cover-edge-detail\{'''
          mobile_replacement='''      .current .cover-subject-detail{\n        top:0;\n        right:0;\n        width:38%;\n        height:31%;\n        z-index:2;\n        background-size:380% auto;\n        background-position:89% 64%;\n        filter:blur(.08px) saturate(1.14) contrast(1.06);\n        -webkit-filter:blur(.08px) saturate(1.14) contrast(1.06);\n        -webkit-mask-image:\n          linear-gradient(90deg, transparent 0%, rgba(0,0,0,.08) 6%, rgba(0,0,0,.30) 12%, rgba(0,0,0,.74) 20%, #000 31%, #000 100%),\n          linear-gradient(180deg, rgba(0,0,0,.16) 0%, rgba(0,0,0,.68) 8%, #000 16%, #000 87%, rgba(0,0,0,.58) 94%, rgba(0,0,0,.10) 100%),\n          radial-gradient(ellipse 44% 30% at 78% 22%, #000 0%, #000 47%, rgba(0,0,0,.92) 59%, rgba(0,0,0,.64) 72%, rgba(0,0,0,.28) 85%, rgba(0,0,0,.07) 94%, transparent 100%),\n          radial-gradient(ellipse 41% 51% at 76% 62%, #000 0%, #000 42%, rgba(0,0,0,.90) 55%, rgba(0,0,0,.60) 70%, rgba(0,0,0,.24) 84%, rgba(0,0,0,.06) 94%, transparent 100%);\n        mask-image:\n          linear-gradient(90deg, transparent 0%, rgba(0,0,0,.08) 6%, rgba(0,0,0,.30) 12%, rgba(0,0,0,.74) 20%, #000 31%, #000 100%),\n          linear-gradient(180deg, rgba(0,0,0,.16) 0%, rgba(0,0,0,.68) 8%, #000 16%, #000 87%, rgba(0,0,0,.58) 94%, rgba(0,0,0,.10) 100%),\n          radial-gradient(ellipse 44% 30% at 78% 22%, #000 0%, #000 47%, rgba(0,0,0,.92) 59%, rgba(0,0,0,.64) 72%, rgba(0,0,0,.28) 85%, rgba(0,0,0,.07) 94%, transparent 100%),\n          radial-gradient(ellipse 41% 51% at 76% 62%, #000 0%, #000 42%, rgba(0,0,0,.90) 55%, rgba(0,0,0,.60) 70%, rgba(0,0,0,.24) 84%, rgba(0,0,0,.06) 94%, transparent 100%);\n      }\n\n      .current .cover-edge-detail{'''
          s,n=re.subn(mobile_pattern,mobile_replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('mobile person block replacement failed')

          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text()
          if 'const CACHE_NAME = "ipcdj-worship-v49";' not in t:
              raise SystemExit('expected v49 cache marker not found')
          sw.write_text(t.replace('const CACHE_NAME = "ipcdj-worship-v49";','const CACHE_NAME = "ipcdj-worship-v50";',1))

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          block='''\n\n## Foreground person treatment v50\n\nWhen a cover person is emphasized, the centered album artwork remains the permanent base. The isolated person must render above every album-art background layer (blurred atmosphere, selective detail reveal, perimeter detail, and palette scrim) while all readable UI remains above the person. Preserve the approved person placement and strong visibility; use broad alpha feathering around the subject layer itself so it merges smoothly into the base cover without a rectangular seam or an over-bright duplicated right-side patch. Desktop and mobile must maintain the same foreground relationship.\n'''
          if '## Foreground person treatment v50' not in u:
              u += block
          st.write_text(u)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Place isolated person clearly above centered album background"
          git push origin main
