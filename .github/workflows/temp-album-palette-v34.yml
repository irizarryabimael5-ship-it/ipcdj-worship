name: One-time album palette v34

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-album-palette-v34.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply album-art adaptive current-card palette
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('content="stage-palette-v33"','content="album-palette-v34"',1)

          old='''    .current{\n      --stage-accent:#e25252;\n      --stage-soft:rgba(226,82,82,.10);\n      --stage-border:rgba(226,82,82,.30);\n      --stage-text:#f8dddd;\n      position:relative;\n      overflow:hidden;\n    }'''
          new='''    .current{\n      --stage-accent:#e25252;\n      --stage-soft:rgba(226,82,82,.10);\n      --stage-border:rgba(226,82,82,.30);\n      --stage-text:#f8dddd;\n      --cover-c1:96,62,44;\n      --cover-c2:166,108,61;\n      --cover-c3:56,76,93;\n      position:relative;\n      overflow:hidden;\n      isolation:isolate;\n    }\n\n    .current::before{\n      content:\"\";\n      position:absolute;\n      inset:0;\n      z-index:0;\n      pointer-events:none;\n      background:\n        radial-gradient(circle at 10% 18%, rgba(var(--cover-c1),.24) 0%, rgba(var(--cover-c1),.10) 28%, rgba(var(--cover-c1),0) 52%),\n        radial-gradient(circle at 88% 22%, rgba(var(--cover-c2),.20) 0%, rgba(var(--cover-c2),.08) 30%, rgba(var(--cover-c2),0) 54%),\n        radial-gradient(circle at 55% 92%, rgba(var(--cover-c3),.16) 0%, rgba(var(--cover-c3),.06) 34%, rgba(var(--cover-c3),0) 58%);\n      opacity:.88;\n      transition:background .8s ease,opacity .8s ease;\n    }\n\n    .current > *{\n      position:relative;\n      z-index:1;\n    }'''
          if old not in s: raise SystemExit('current block not found')
          s=s.replace(old,new,1)

          s=s.replace('''    .current::after{\n      content:\"\";\n      position:absolute;\n      width:280px;\n      height:280px;\n      border-radius:50%;\n      right:-100px;\n      top:-100px;\n      background:radial-gradient(circle, rgba(255,255,255,.025), rgba(255,255,255,0) 72%);\n      pointer-events:none;\n    }''','''    .current::after{\n      content:\"\";\n      position:absolute;\n      z-index:0;\n      width:280px;\n      height:280px;\n      border-radius:50%;\n      right:-100px;\n      top:-100px;\n      background:radial-gradient(circle, rgba(255,255,255,.025), rgba(255,255,255,0) 72%);\n      pointer-events:none;\n    }''',1)

          old='''    .timeline-item{\n      border:1px solid var(--line);\n      background:rgba(255,255,255,.022);\n      border-radius:14px;\n      padding:12px 14px;\n    }'''
          new='''    .timeline-item{\n      border:1px solid var(--line);\n      background:rgba(255,255,255,.022);\n      border-radius:14px;\n      padding:12px 14px;\n    }\n\n    .current .timeline-item:not(.active-phase):not(.estreno){\n      background:linear-gradient(90deg,rgba(var(--cover-c1),.045),rgba(var(--cover-c2),.022),rgba(255,255,255,.012));\n      border-color:rgba(255,255,255,.085);\n    }'''
          if old not in s: raise SystemExit('timeline block not found')
          s=s.replace(old,new,1)

          old='''    const rgba=(values,alpha)=>\"rgba(\"+values.join(\",\")+\",\"+alpha+\")\";'''
          new='''    const rgba=(values,alpha)=>\"rgba(\"+values.join(\",\")+\",\"+alpha+\")\";\n\n    // Album-art adaptive current-card theming. The semantic stage palette remains\n    // independent; album artwork only supplies the card atmosphere.\n    const COVER_THEME_CACHE_PREFIX=\"ipcdj-cover-theme-v1:\";\n    const COVER_THEME_FALLBACKS={\n      \"dios-de-milagros\":[[96,62,44],[166,108,61],[56,76,93]],\n      \"glorioso-dia\":[[38,78,139],[215,142,78],[205,177,78]],\n      \"no-fallaras\":[[53,72,76],[178,111,65],[88,70,48]]\n    };\n    let coverThemeRequestToken=0;\n\n    const normalizeCatalogText=value=>String(value||\"\")\n      .normalize(\"NFD\")\n      .replace(/[\\u0300-\\u036f]/g,\"\")\n      .toLowerCase()\n      .replace(/[^a-z0-9]+/g,\" \")\n      .trim();\n\n    const colorDistance=(a,b)=>Math.sqrt(\n      Math.pow(a[0]-b[0],2)+Math.pow(a[1]-b[1],2)+Math.pow(a[2]-b[2],2)\n    );\n\n    function tuneCoverColor(color){\n      let [r,g,b]=color;\n      const lum=.2126*r+.7152*g+.0722*b;\n      if(lum<62){ r+=(255-r)*.18; g+=(255-g)*.18; b+=(255-b)*.18; }\n      if(lum>205){ r*=.78; g*=.78; b*=.78; }\n      return [Math.round(r),Math.round(g),Math.round(b)];\n    }\n\n    function extractCoverPalette(image){\n      const canvas=document.createElement(\"canvas\");\n      canvas.width=48; canvas.height=48;\n      const ctx=canvas.getContext(\"2d\",{willReadFrequently:true});\n      if(!ctx)throw new Error(\"Canvas unavailable\");\n      ctx.drawImage(image,0,0,48,48);\n      const data=ctx.getImageData(0,0,48,48).data;\n      const buckets=new Map();\n\n      for(let i=0;i<data.length;i+=4){\n        if(data[i+3]<220)continue;\n        const r=data[i],g=data[i+1],b=data[i+2];\n        const max=Math.max(r,g,b),min=Math.min(r,g,b);\n        const lum=.2126*r+.7152*g+.0722*b;\n        const sat=max===0?0:(max-min)/max;\n        if(lum<20||lum>242)continue;\n        const qr=Math.round(r/24)*24, qg=Math.round(g/24)*24, qb=Math.round(b/24)*24;\n        const key=qr+\",\"+qg+\",\"+qb;\n        const prior=buckets.get(key)||{rgb:[qr,qg,qb],count:0,score:0};\n        prior.count++;\n        prior.score+=.55+(sat*1.55)+(lum>55&&lum<210?.35:0);\n        buckets.set(key,prior);\n      }\n\n      const ranked=[...buckets.values()].sort((a,b)=>b.score-a.score);\n      const chosen=[];\n      for(const item of ranked){\n        if(chosen.every(c=>colorDistance(c,item.rgb)>68)){\n          chosen.push(tuneCoverColor(item.rgb));\n          if(chosen.length===3)break;\n        }\n      }\n      while(chosen.length<3)chosen.push(chosen[chosen.length-1]||[90,90,90]);\n      return chosen;\n    }\n\n    function applyCoverTheme(song,palette){\n      const card=$(\"current-song-card\");\n      if(!card||!palette||palette.length<3)return;\n      card.style.setProperty(\"--cover-c1\",palette[0].join(\",\"));\n      card.style.setProperty(\"--cover-c2\",palette[1].join(\",\"));\n      card.style.setProperty(\"--cover-c3\",palette[2].join(\",\"));\n      card.dataset.coverTheme=song.id;\n    }\n\n    function loadPaletteFromArtwork(url){\n      return new Promise((resolve,reject)=>{\n        const image=new Image();\n        image.crossOrigin=\"anonymous\";\n        image.decoding=\"async\";\n        image.onload=()=>{\n          try{resolve(extractCoverPalette(image))}catch(error){reject(error)}\n        };\n        image.onerror=reject;\n        image.src=url;\n      });\n    }\n\n    function scoreCatalogResult(song,result){\n      const targetTitle=normalizeCatalogText(song.title);\n      const targetArtist=normalizeCatalogText(song.artist);\n      const title=normalizeCatalogText(result.trackName||result.collectionName);\n      const artist=normalizeCatalogText(result.artistName);\n      let score=0;\n      if(title===targetTitle)score+=12;\n      else if(title.includes(targetTitle)||targetTitle.includes(title))score+=8;\n      const artistTokens=targetArtist.split(\" \").filter(t=>t.length>3);\n      score+=artistTokens.filter(t=>artist.includes(t)).length*2;\n      if(result.artworkUrl100)score+=2;\n      return score;\n    }\n\n    async function resolveArtworkUrl(song){\n      if(song.itunesCollectionId){\n        try{\n          const response=await fetch(\"https://itunes.apple.com/lookup?id=\"+encodeURIComponent(song.itunesCollectionId)+\"&entity=song&limit=10\",{cache:\"force-cache\"});\n          if(response.ok){\n            const data=await response.json();\n            const candidate=(data.results||[]).filter(r=>r.artworkUrl100).sort((a,b)=>scoreCatalogResult(song,b)-scoreCatalogResult(song,a))[0];\n            if(candidate&&candidate.artworkUrl100)return candidate.artworkUrl100;\n          }\n        }catch(_){}\n      }\n\n      const query=encodeURIComponent((song.artworkQuery||song.title+\" \"+song.artist));\n      const response=await fetch(\"https://itunes.apple.com/search?term=\"+query+\"&country=US&media=music&entity=song&limit=12\",{cache:\"force-cache\"});\n      if(!response.ok)throw new Error(\"Catalog lookup failed\");\n      const data=await response.json();\n      const candidate=(data.results||[]).filter(r=>r.artworkUrl100).sort((a,b)=>scoreCatalogResult(song,b)-scoreCatalogResult(song,a))[0];\n      if(!candidate||scoreCatalogResult(song,candidate)<4)throw new Error(\"No reliable artwork match\");\n      return candidate.artworkUrl100;\n    }\n\n    async function ensureCoverTheme(song){\n      const token=++coverThemeRequestToken;\n      const fallback=COVER_THEME_FALLBACKS[song.id]||[[82,74,68],[116,92,70],[58,68,78]];\n      applyCoverTheme(song,fallback);\n\n      try{\n        const cached=localStorage.getItem(COVER_THEME_CACHE_PREFIX+song.id);\n        if(cached){\n          const parsed=JSON.parse(cached);\n          if(Array.isArray(parsed)&&parsed.length>=3){\n            if(token===coverThemeRequestToken)applyCoverTheme(song,parsed);\n            return;\n          }\n        }\n      }catch(_){}\n\n      try{\n        const artworkUrl=await resolveArtworkUrl(song);\n        const palette=await loadPaletteFromArtwork(artworkUrl);\n        if(token!==coverThemeRequestToken)return;\n        applyCoverTheme(song,palette);\n        try{localStorage.setItem(COVER_THEME_CACHE_PREFIX+song.id,JSON.stringify(palette))}catch(_){}\n      }catch(_){\n        // Keep the curated fallback palette. Network/CORS/catalog failures must never\n        // affect the song pipeline or card readability.\n      }\n    }'''
          if old not in s: raise SystemExit('rgba helper not found')
          s=s.replace(old,new,1)

          s=s.replace('''        id:\"dios-de-milagros\",\n        title:\"Dios De Milagros\",\n        artist:\"Miel San Marcos & Kim Richards\",''','''        id:\"dios-de-milagros\",\n        title:\"Dios De Milagros\",\n        artist:\"Miel San Marcos & Kim Richards\",\n        artworkQuery:\"Dios De Milagros En Vivo Desde México Miel San Marcos Kim Richards\",\n        itunesCollectionId:\"6799307691\",''',1)
          s=s.replace('''        id:\"glorioso-dia\",\n        title:\"Glorioso Día\",\n        artist:\"Passion Music\",''','''        id:\"glorioso-dia\",\n        title:\"Glorioso Día\",\n        artist:\"Passion Music\",\n        artworkQuery:\"Glorioso Día Passion Kristian Stanfill 2017\",''',1)
          s=s.replace('''        id:\"no-fallaras\",\n        title:\"No Fallarás\",\n        artist:\"Saddleback Worship\",''','''        id:\"no-fallaras\",\n        title:\"No Fallarás\",\n        artist:\"Saddleback Worship\",\n        artworkQuery:\"No Fallarás En Vivo Saddleback Worship 2024\",\n        itunesCollectionId:\"1760002960\",''',1)

          old='''      $(\"current-song-name\").textContent=song.title;\n      $(\"current-artist\").textContent=song.artist;'''
          new='''      $(\"current-song-name\").textContent=song.title;\n      $(\"current-artist\").textContent=song.artist;\n      if(card.dataset.coverTheme!==song.id)ensureCoverTheme(song);'''
          if old not in s: raise SystemExit('render current anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text().replace('const CACHE_NAME = \"ipcdj-worship-v33\";','const CACHE_NAME = \"ipcdj-worship-v34\";',1)
          sw.write_text(t)

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          block='''\n\n## Album-art adaptive active-song card\n\nThe current-song preparation card may derive a restrained atmospheric palette from the active song's official album/single artwork while keeping semantic stage colors independent.\n\nRequired behavior:\n- The animated page-wide ambient gradient is untouched and remains independent.\n- Album-art color only affects the current-song card atmosphere and subtle inactive timeline surfaces.\n- Red → orange → amber → green preparation semantics remain authoritative for status, active phase and progress. Estreno remains gold.\n- When a song becomes current, resolve its artwork from the music catalog, extract a small palette client-side, cache it locally, and apply it automatically.\n- Prefer ID-based catalog lookup when a known collection ID is available; otherwise use a narrow title + artist search and score matches.\n- Downsample artwork before pixel analysis for performance. Ignore extreme near-black/near-white pixels and select visually distinct swatches.\n- Every known pipeline song has a curated fallback palette so network, catalog or CORS failure never breaks the card.\n- Future songs inherit the automatic artwork lookup without needing custom CSS; an optional artworkQuery/itunesCollectionId can improve ambiguous matching.\n- Never let album colors reduce text legibility or replace semantic color meaning.\n- Do not display album artwork itself unless separately requested; this feature uses the palette as atmospheric theming only.\n'''
          if '## Album-art adaptive active-song card' not in u:u+=block
          st.write_text(u)
          PY
      - name: Commit migration
        run: |
          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Add automatic album-art adaptive current-song palette"
          git push origin main
