name: One-time stage palette v33

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-stage-palette-v33.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply professional stage palette
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()

          replacements = [
            ('<meta name="ipcdj-build" content="gradient-start-v32" />','<meta name="ipcdj-build" content="stage-palette-v33" />'),
            ('''    .current{\n      position:relative;\n      overflow:hidden;\n    }''','''    .current{\n      --stage-accent:#e25252;\n      --stage-soft:rgba(226,82,82,.10);\n      --stage-border:rgba(226,82,82,.30);\n      --stage-text:#f8dddd;\n      position:relative;\n      overflow:hidden;\n    }'''),
            ('''      background:rgba(105,136,255,.12);\n      border:1px solid rgba(130,159,255,.22);\n      color:#eef3ff;''','''      background:var(--stage-soft);\n      border:1px solid var(--stage-border);\n      color:var(--stage-text);\n      box-shadow:inset 0 1px 0 rgba(255,255,255,.035);'''),
            ('''      border:1px solid rgba(255,92,92,.22);\n      background:linear-gradient(180deg, rgba(151,34,34,.075), rgba(68,20,24,.035));''','''      border:1px solid rgba(255,255,255,.09);\n      background:linear-gradient(180deg, rgba(255,255,255,.026), rgba(255,255,255,.012));'''),
            ('''      color:#f5e7e7;''','''      color:#ece9e2;'''),
            ('''      color:#d9a9a9;''','''      color:#dac89c;'''),
            ('''      color:#c79d9d;''','''      color:#b9b2a4;'''),
            ('''      color:#dff7e5;''','''      color:var(--stage-text);'''),
            ('''    .timeline-item.active-phase{\n      border-color:rgba(105,136,255,.30);\n      background:linear-gradient(90deg,rgba(76,109,218,.085),rgba(255,255,255,.015));\n      box-shadow:inset 3px 0 0 rgba(124,160,255,.72);\n    }''','''    .timeline-item.active-phase{\n      border-color:var(--stage-border);\n      background:linear-gradient(90deg,var(--stage-soft),rgba(255,255,255,.012));\n      box-shadow:inset 3px 0 0 var(--stage-accent);\n    }'''),
            ('''      color:#9fcfa9;''','''      color:var(--stage-text);'''),
            ('''      border-color:rgba(255,92,92,.32);\n      background:\n        linear-gradient(90deg, rgba(167,32,32,.085), rgba(255,255,255,.015));\n      box-shadow:inset 3px 0 0 rgba(255,79,79,.78);''','''      border-color:rgba(242,193,78,.34);\n      background:\n        linear-gradient(90deg, rgba(173,128,28,.085), rgba(255,255,255,.015));\n      box-shadow:inset 3px 0 0 rgba(242,193,78,.82);'''),
            ('''      background:#ff5a5a;\n      box-shadow:0 0 12px rgba(255,90,90,.55);''','''      background:#f2c14e;\n      box-shadow:0 0 12px rgba(242,193,78,.48);'''),
            ('''      color:#f2dddd;''','''      color:#f4e5bc;'''),
            ('''      border:1px solid rgba(255,92,92,.28);\n      background:linear-gradient(180deg, rgba(151,34,34,.11), rgba(107,24,24,.065));''','''      border:1px solid rgba(242,193,78,.28);\n      background:linear-gradient(180deg, rgba(154,117,28,.10), rgba(100,77,22,.055));'''),
            ('''      background:#ff6262;\n      box-shadow:0 0 10px rgba(255,98,98,.42);''','''      background:#f2c14e;\n      box-shadow:0 0 10px rgba(242,193,78,.40);'''),
            ('''    const PROGRESS_COLORS={\n      learningStart:[53,183,92],\n      learningEnd:[101,220,131],\n      finalStart:[104,145,238],\n      finalEnd:[137,169,255],\n      release:[255,90,90]\n    };''','''    const PROGRESS_COLORS={\n      learningStart:[226,82,82],\n      learningEnd:[242,145,63],\n      finalStart:[226,179,65],\n      finalEnd:[58,176,110],\n      release:[242,193,78]\n    };'''),
            ('''        border:rgba(base,.24),\n        phaseText''','''        border:rgba(base,.28),\n        accent:rgb(base),\n        stageText:rgb(mixRgb(base,[255,255,255],.70)),\n        phaseText'''),
            ('''      wrap.style.setProperty("--progress-border",palette.border);\n      wrap.dataset.progressPhase=palette.phaseText;''','''      wrap.style.setProperty("--progress-border",palette.border);\n      wrap.dataset.progressPhase=palette.phaseText;\n\n      const card=$("current-song-card");\n      if(card){\n        card.style.setProperty("--stage-accent",palette.accent);\n        card.style.setProperty("--stage-soft",palette.soft);\n        card.style.setProperty("--stage-border",palette.border);\n        card.style.setProperty("--stage-text",palette.stageText);\n      }'''),
            ('''            progressWrap.style.removeProperty("--progress-border");\n          }''','''            progressWrap.style.removeProperty("--progress-border");\n          }\n          if(card){\n            card.style.removeProperty("--stage-accent");\n            card.style.removeProperty("--stage-soft");\n            card.style.removeProperty("--stage-border");\n            card.style.removeProperty("--stage-text");\n          }''')
          ]

          for old,new in replacements:
              if old not in s:
                  raise SystemExit('Expected index.html fragment not found:\n'+old[:180])
              s=s.replace(old,new,1)
          p.write_text(s)

          sw=Path('sw.js')
          w=sw.read_text()
          old='const CACHE_NAME = "ipcdj-worship-v32";'
          if old not in w:
              raise SystemExit('Expected service worker cache marker not found')
          sw.write_text(w.replace(old,'const CACHE_NAME = "ipcdj-worship-v33";',1))

          standards=Path('SITE_STANDARDS.md')
          t=standards.read_text()
          heading='## Song preparation status palette\n'
          if heading not in t:
              t += '''\n\n## Song preparation status palette\n\nThe preparation-stage color system communicates movement from early preparation toward readiness while preserving text labels and other non-color cues.\n\nRequired progression:\n- Earliest/upcoming and early learning begin in a restrained warm red.\n- Learning matures through orange.\n- Transition toward final preparation uses amber/gold.\n- Final preparation resolves into green to communicate readiness.\n- Estreno is a separate celebratory milestone and uses gold rather than red.\n- The current-phase timeline tab and current-song status pill inherit the live stage color; they must not default to a distracting fixed blue.\n- Countdown surfaces stay mostly neutral so they do not compete with the stage signal.\n- Future release-date badges use the estreno gold family, not red.\n- Brand blue remains available for IPCDJ branding, links/focus, and non-stage identity, but not as the default current preparation-stage indicator.\n- Status meaning must never rely on color alone: phase names, labels, timeline position, and text remain present.\n- Maintain strong text/background contrast and subdued translucent fills suitable for the site's dark glass interface.\n- The animated ambient gradient background is independent and must remain untouched by stage-palette changes.\n'''
          standards.write_text(t)
          PY

      - name: Commit migration
        run: |
          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Rework song stages from red preparation to green readiness"
          git push origin main
