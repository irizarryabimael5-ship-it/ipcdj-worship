name: One-time person isolation v49

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-person-isolation-v49.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep person foreground while suppressing duplicate right-side artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          if 'content="person-layer-v48"' not in s:
              raise SystemExit('expected v48 build marker not found')
          s=s.replace('content="person-layer-v48"','content="person-isolation-v49"',1)

          old='''      -webkit-mask-image:\n        radial-gradient(ellipse 42% 29% at 77% 22%, #000 0%, #000 46%, rgba(0,0,0,.92) 58%, rgba(0,0,0,.68) 70%, rgba(0,0,0,.34) 82%, rgba(0,0,0,.12) 90%, transparent 100%),\n        radial-gradient(ellipse 39% 49% at 75% 61%, #000 0%, #000 42%, rgba(0,0,0,.90) 55%, rgba(0,0,0,.62) 69%, rgba(0,0,0,.30) 82%, rgba(0,0,0,.10) 91%, transparent 100%);\n      mask-image:\n        radial-gradient(ellipse 42% 29% at 77% 22%, #000 0%, #000 46%, rgba(0,0,0,.92) 58%, rgba(0,0,0,.68) 70%, rgba(0,0,0,.34) 82%, rgba(0,0,0,.12) 90%, transparent 100%),\n        radial-gradient(ellipse 39% 49% at 75% 61%, #000 0%, #000 42%, rgba(0,0,0,.90) 55%, rgba(0,0,0,.62) 69%, rgba(0,0,0,.30) 82%, rgba(0,0,0,.10) 91%, transparent 100%);'''

          new='''      -webkit-mask-image:\n        radial-gradient(ellipse 24% 20% at 72% 22%, #000 0%, #000 50%, rgba(0,0,0,.92) 62%, rgba(0,0,0,.58) 74%, rgba(0,0,0,.20) 87%, transparent 100%),\n        radial-gradient(ellipse 26% 40% at 70% 58%, #000 0%, #000 44%, rgba(0,0,0,.88) 58%, rgba(0,0,0,.54) 72%, rgba(0,0,0,.18) 86%, transparent 100%),\n        linear-gradient(100deg, transparent 0 55%, rgba(0,0,0,.18) 62%, rgba(0,0,0,.76) 72%, #000 82% 91%, rgba(0,0,0,.36) 96%, transparent 100%);\n      mask-image:\n        radial-gradient(ellipse 24% 20% at 72% 22%, #000 0%, #000 50%, rgba(0,0,0,.92) 62%, rgba(0,0,0,.58) 74%, rgba(0,0,0,.20) 87%, transparent 100%),\n        radial-gradient(ellipse 26% 40% at 70% 58%, #000 0%, #000 44%, rgba(0,0,0,.88) 58%, rgba(0,0,0,.54) 72%, rgba(0,0,0,.18) 86%, transparent 100%),\n        linear-gradient(100deg, transparent 0 55%, rgba(0,0,0,.18) 62%, rgba(0,0,0,.76) 72%, #000 82% 91%, rgba(0,0,0,.36) 96%, transparent 100%);'''
          if old not in s:
              raise SystemExit('v48 desktop mask block not found')
          s=s.replace(old,new,1)

          old_mobile='''        -webkit-mask-image:\n          radial-gradient(ellipse 44% 30% at 78% 22%, #000 0%, #000 43%, rgba(0,0,0,.90) 56%, rgba(0,0,0,.64) 70%, rgba(0,0,0,.30) 83%, rgba(0,0,0,.10) 92%, transparent 100%),\n          radial-gradient(ellipse 41% 51% at 76% 62%, #000 0%, #000 39%, rgba(0,0,0,.88) 53%, rgba(0,0,0,.58) 68%, rgba(0,0,0,.26) 82%, rgba(0,0,0,.08) 92%, transparent 100%);\n        mask-image:\n          radial-gradient(ellipse 44% 30% at 78% 22%, #000 0%, #000 43%, rgba(0,0,0,.90) 56%, rgba(0,0,0,.64) 70%, rgba(0,0,0,.30) 83%, rgba(0,0,0,.10) 92%, transparent 100%),\n          radial-gradient(ellipse 41% 51% at 76% 62%, #000 0%, #000 39%, rgba(0,0,0,.88) 53%, rgba(0,0,0,.58) 68%, rgba(0,0,0,.26) 82%, rgba(0,0,0,.08) 92%, transparent 100%);'''

          new_mobile='''        -webkit-mask-image:\n          radial-gradient(ellipse 26% 21% at 73% 23%, #000 0%, #000 47%, rgba(0,0,0,.90) 60%, rgba(0,0,0,.56) 74%, rgba(0,0,0,.18) 88%, transparent 100%),\n          radial-gradient(ellipse 28% 42% at 71% 59%, #000 0%, #000 41%, rgba(0,0,0,.86) 55%, rgba(0,0,0,.50) 70%, rgba(0,0,0,.16) 86%, transparent 100%),\n          linear-gradient(100deg, transparent 0 55%, rgba(0,0,0,.16) 62%, rgba(0,0,0,.72) 73%, #000 83% 91%, rgba(0,0,0,.30) 96%, transparent 100%);\n        mask-image:\n          radial-gradient(ellipse 26% 21% at 73% 23%, #000 0%, #000 47%, rgba(0,0,0,.90) 60%, rgba(0,0,0,.56) 74%, rgba(0,0,0,.18) 88%, transparent 100%),\n          radial-gradient(ellipse 28% 42% at 71% 59%, #000 0%, #000 41%, rgba(0,0,0,.86) 55%, rgba(0,0,0,.50) 70%, rgba(0,0,0,.16) 86%, transparent 100%),\n          linear-gradient(100deg, transparent 0 55%, rgba(0,0,0,.16) 62%, rgba(0,0,0,.72) 73%, #000 83% 91%, rgba(0,0,0,.30) 96%, transparent 100%);'''
          if old_mobile not in s:
              raise SystemExit('v48 mobile mask block not found')
          s=s.replace(old_mobile,new_mobile,1)
          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text()
          if 'const CACHE_NAME = "ipcdj-worship-v48";' not in t:
              raise SystemExit('expected v48 cache marker not found')
          sw.write_text(t.replace('const CACHE_NAME = "ipcdj-worship-v48";','const CACHE_NAME = "ipcdj-worship-v49";',1))

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          block='''\n\n## Foreground-person isolation v49\n\nKeep the isolated person above the centered album-art background stack, but do not let the foreground subject layer reintroduce a bright or obvious duplicate of the right side of the cover. Preserve the approved person placement and visibility while tightening the alpha mask around the head, torso, and any necessary limb extension. The duplicate source image outside the person must fall away into transparency so the universal centered-cover treatment remains visually dominant. The person should read as a foreground extension of the same image, not as a brighter rectangular or right-side duplicate.\n'''
          if '## Foreground-person isolation v49' not in u:
              u += block
          st.write_text(u)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Tighten foreground person isolation without changing placement"
          git push origin main
