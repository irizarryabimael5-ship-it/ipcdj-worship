name: One-time blurred cover v35

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-blurred-cover-v35.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply blurred official cover treatment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('content="album-palette-v34"','content="blurred-cover-v35"',1)

          if '--cover-image:none;' not in s:
              s=s.replace('      --cover-c3:56,76,93;\n', '      --cover-c3:56,76,93;\n      --cover-image:none;\n', 1)

          before_re=r'''    \.current::before\{.*?\n    \}\n\n    \.current > \*\{'''
          before_new='''    .current::before{\n      content:"";\n      position:absolute;\n      inset:-34px;\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:cover;\n      background-position:center;\n      background-repeat:no-repeat;\n      filter:blur(30px) saturate(1.18) contrast(1.04);\n      -webkit-filter:blur(30px) saturate(1.18) contrast(1.04);\n      transform:scale(1.10);\n      opacity:.76;\n      transition:opacity .8s ease,filter .8s ease;\n    }\n\n    .current > *{'''
          s,n=re.subn(before_re,before_new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('current before block not found')

          after_re=r'''    \.current::after\{.*?\n    \}\n\n    \.status\{'''
          after_new='''    .current::after{\n      content:"";\n      position:absolute;\n      inset:0;\n      z-index:0;\n      pointer-events:none;\n      background:\n        radial-gradient(circle at 12% 14%, rgba(var(--cover-c1),.22) 0%, rgba(var(--cover-c1),.08) 27%, rgba(var(--cover-c1),0) 50%),\n        radial-gradient(circle at 88% 24%, rgba(var(--cover-c2),.18) 0%, rgba(var(--cover-c2),.06) 30%, rgba(var(--cover-c2),0) 54%),\n        linear-gradient(180deg, rgba(4,7,12,.26) 0%, rgba(5,8,14,.46) 44%, rgba(4,7,12,.76) 100%);\n      box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);\n    }\n\n    .status{'''
          s,n=re.subn(after_re,after_new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('current after block not found')

          # Add a cover-image setter and high-res Apple artwork helper.
          anchor='''    function applyCoverTheme(song,palette){\n      const card=$("current-song-card");\n      if(!card||!palette||palette.length<3)return;\n      card.style.setProperty("--cover-c1",palette[0].join(","));\n      card.style.setProperty("--cover-c2",palette[1].join(","));\n      card.style.setProperty("--cover-c3",palette[2].join(","));\n      card.dataset.coverTheme=song.id;\n    }'''
          repl='''    function applyCoverTheme(song,palette){\n      const card=$("current-song-card");\n      if(!card||!palette||palette.length<3)return;\n      card.style.setProperty("--cover-c1",palette[0].join(","));\n      card.style.setProperty("--cover-c2",palette[1].join(","));\n      card.style.setProperty("--cover-c3",palette[2].join(","));\n      card.dataset.coverTheme=song.id;\n    }\n\n    function highResolutionArtworkUrl(url){\n      if(!url)return "";\n      return String(url)\n        .replace(/\\/100x100bb(?:-[0-9]+)?\\.(jpg|jpeg|png)(?:\\?.*)?$/i,"/1200x1200bb.$1")\n        .replace(/100x100bb/gi,"1200x1200bb");\n    }\n\n    function applyCoverArtwork(song,url){\n      const card=$("current-song-card");\n      if(!card||!url)return;\n      const safe=highResolutionArtworkUrl(url).replace(/[\\"'\\\\()]/g, m=>"\\\\"+m);\n      card.style.setProperty("--cover-image",'url("'+safe+'")');\n      card.dataset.coverArtwork=song.id;\n    }'''
          if anchor not in s: raise SystemExit('applyCoverTheme anchor not found')
          s=s.replace(anchor,repl,1)

          # Always return a high-resolution image URL from catalog resolution.
          s=s.replace('''            if(candidate&&candidate.artworkUrl100)return candidate.artworkUrl100;''','''            if(candidate&&candidate.artworkUrl100)return highResolutionArtworkUrl(candidate.artworkUrl100);''',1)
          s=s.replace('''      return candidate.artworkUrl100;''','''      return highResolutionArtworkUrl(candidate.artworkUrl100);''',1)

          # Replace ensureCoverTheme so cached palette never prevents artwork from loading.
          ensure_re=r'''    async function ensureCoverTheme\(song\)\{.*?\n    \}\n\n    function getCurrentSong'''
          ensure_new='''    async function ensureCoverTheme(song){\n      const token=++coverThemeRequestToken;\n      const fallback=COVER_THEME_FALLBACKS[song.id]||[[82,74,68],[116,92,70],[58,68,78]];\n      applyCoverTheme(song,fallback);\n\n      let cachedPalette=null;\n      try{\n        const cached=localStorage.getItem(COVER_THEME_CACHE_PREFIX+song.id);\n        if(cached){\n          const parsed=JSON.parse(cached);\n          if(Array.isArray(parsed)&&parsed.length>=3){\n            cachedPalette=parsed;\n            if(token===coverThemeRequestToken)applyCoverTheme(song,parsed);\n          }\n        }\n      }catch(_){}\n\n      try{\n        const artworkUrl=song.artworkUrl\n          ? highResolutionArtworkUrl(song.artworkUrl)\n          : await resolveArtworkUrl(song);\n        if(token!==coverThemeRequestToken)return;\n\n        // The official cover itself becomes the card atmosphere. It is heavily blurred\n        // and darkened by CSS, so text remains readable and the artwork becomes a palette.\n        applyCoverArtwork(song,artworkUrl);\n\n        if(cachedPalette)return;\n\n        const palette=await loadPaletteFromArtwork(artworkUrl);\n        if(token!==coverThemeRequestToken)return;\n        applyCoverTheme(song,palette);\n        try{localStorage.setItem(COVER_THEME_CACHE_PREFIX+song.id,JSON.stringify(palette))}catch(_){}\n      }catch(_){\n        // Keep the curated fallback palette. Artwork/catalog/CORS failures never affect\n        // countdown, preparation stages, song rollover, or card readability.\n      }\n    }\n\n    function getCurrentSong'''
          s,n=re.subn(ensure_re,ensure_new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('ensureCoverTheme block not found')

          # If the current song changes, refresh both artwork and palette.
          s=s.replace('''      if(card.dataset.coverTheme!==song.id)ensureCoverTheme(song);''','''      if(card.dataset.coverTheme!==song.id || card.dataset.coverArtwork!==song.id)ensureCoverTheme(song);''',1)

          # Reset the cover if the pipeline has no active current song.
          reset_anchor='''            card.style.removeProperty("--stage-text");\n          }'''
          reset_repl='''            card.style.removeProperty("--stage-text");\n            card.style.removeProperty("--cover-image");\n            delete card.dataset.coverArtwork;\n            delete card.dataset.coverTheme;\n          }'''
          if reset_anchor in s:
              s=s.replace(reset_anchor,reset_repl,1)

          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text().replace('const CACHE_NAME = "ipcdj-worship-v34";','const CACHE_NAME = "ipcdj-worship-v35";',1)
          sw.write_text(t)

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          block='''\n\n## Blurred official-cover active-song background\n\nThe current-song card uses the active song's official album/single artwork as a heavily blurred atmospheric background.\n\nRequired behavior:\n- Only the current-song card receives the artwork; the page-wide moving ambient gradient is untouched.\n- Resolve official artwork through a stable catalog ID whenever one is known; otherwise use title/artist matching.\n- Request a high-resolution artwork variant when the catalog supports it.\n- The artwork layer is cover-sized, strongly blurred, slightly scaled, and saturated enough to preserve the cover's identity without exposing distracting text/details.\n- A dark scrim sits above the artwork so all card text remains readable.\n- A restrained extracted-palette overlay may reinforce the cover colors.\n- Semantic preparation colors remain independent: red → orange → amber → green, with gold for Estreno.\n- Cached palette data must never prevent the actual artwork layer from loading.\n- Catalog/artwork/CORS failures fall back gracefully to the curated palette and must never affect countdown, rollover, preparation phases, or card readability.\n- When the active song changes, the card automatically resolves and applies that new song's official cover.\n'''
          if '## Blurred official-cover active-song background' not in u:
              u += block
          st.write_text(u)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Use blurred official artwork for current song card"
          git push origin main
