name: One-time person seam refinement v47

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-person-seam-v47.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore approved person framing and feather only the seam
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          if 'content="auto-person-v46"' not in s:
              raise SystemExit('expected v46 build marker not found')
          s=s.replace('content="auto-person-v46"','content="person-seam-v47"',1)

          old_css='''    .current .cover-subject-detail{\n      position:absolute;\n      top:-3%;\n      right:-2%;\n      width:calc(var(--subject-width) + 8%);\n      height:calc(var(--subject-height) + 8%);\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:var(--subject-bg-size) auto;\n      background-position:var(--subject-bg-x) var(--subject-bg-y);\n      background-repeat:no-repeat;\n      filter:blur(.18px) saturate(1.14) contrast(1.06);\n      -webkit-filter:blur(.18px) saturate(1.14) contrast(1.06);\n      opacity:var(--subject-opacity);\n      transform:translateZ(0);\n      transform-origin:top right;\n      -webkit-mask-image:\n        radial-gradient(ellipse 43% 30% at 74% 27%, #000 0%, #000 38%, rgba(0,0,0,.92) 54%, rgba(0,0,0,.62) 69%, rgba(0,0,0,.28) 82%, transparent 96%),\n        radial-gradient(ellipse 38% 49% at 74% 60%, #000 0%, #000 34%, rgba(0,0,0,.90) 50%, rgba(0,0,0,.58) 66%, rgba(0,0,0,.24) 80%, transparent 96%);\n      mask-image:\n        radial-gradient(ellipse 43% 30% at 74% 27%, #000 0%, #000 38%, rgba(0,0,0,.92) 54%, rgba(0,0,0,.62) 69%, rgba(0,0,0,.28) 82%, transparent 96%),\n        radial-gradient(ellipse 38% 49% at 74% 60%, #000 0%, #000 34%, rgba(0,0,0,.90) 50%, rgba(0,0,0,.58) 66%, rgba(0,0,0,.24) 80%, transparent 96%);\n      -webkit-mask-composite:source-over;\n      mask-composite:add;\n      transition:opacity .8s ease;\n      will-change:opacity;\n    }'''

          new_css='''    .current .cover-subject-detail{\n      position:absolute;\n      top:0;\n      right:0;\n      width:var(--subject-width);\n      height:var(--subject-height);\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:var(--subject-bg-size) auto;\n      background-position:var(--subject-bg-x) var(--subject-bg-y);\n      background-repeat:no-repeat;\n      filter:blur(.10px) saturate(1.16) contrast(1.08);\n      -webkit-filter:blur(.10px) saturate(1.16) contrast(1.08);\n      opacity:var(--subject-opacity);\n      transform:none;\n      transform-origin:top right;\n      -webkit-mask-image:\n        radial-gradient(ellipse 42% 29% at 77% 22%, #000 0%, #000 46%, rgba(0,0,0,.92) 58%, rgba(0,0,0,.68) 70%, rgba(0,0,0,.34) 82%, rgba(0,0,0,.12) 90%, transparent 100%),\n        radial-gradient(ellipse 39% 49% at 75% 61%, #000 0%, #000 42%, rgba(0,0,0,.90) 55%, rgba(0,0,0,.62) 69%, rgba(0,0,0,.30) 82%, rgba(0,0,0,.10) 91%, transparent 100%);\n      mask-image:\n        radial-gradient(ellipse 42% 29% at 77% 22%, #000 0%, #000 46%, rgba(0,0,0,.92) 58%, rgba(0,0,0,.68) 70%, rgba(0,0,0,.34) 82%, rgba(0,0,0,.12) 90%, transparent 100%),\n        radial-gradient(ellipse 39% 49% at 75% 61%, #000 0%, #000 42%, rgba(0,0,0,.90) 55%, rgba(0,0,0,.62) 69%, rgba(0,0,0,.30) 82%, rgba(0,0,0,.10) 91%, transparent 100%);\n      -webkit-mask-composite:source-over;\n      mask-composite:add;\n      transition:opacity .8s ease;\n      will-change:opacity;\n    }'''
          if old_css not in s:
              raise SystemExit('v46 desktop subject css not found')
          s=s.replace(old_css,new_css,1)

          old_mobile='''      .current .cover-subject-detail{\n        top:-4%;\n        right:-4%;\n        width:calc(var(--subject-width) + 16%);\n        height:calc(var(--subject-height) + 11%);\n        background-size:var(--subject-bg-size) auto;\n        background-position:var(--subject-bg-x) var(--subject-bg-y);\n        filter:blur(.28px) saturate(1.12) contrast(1.05);\n        -webkit-filter:blur(.28px) saturate(1.12) contrast(1.05);\n        -webkit-mask-image:\n          radial-gradient(ellipse 45% 31% at 74% 27%, #000 0%, #000 34%, rgba(0,0,0,.88) 51%, rgba(0,0,0,.54) 67%, rgba(0,0,0,.22) 82%, transparent 97%),\n          radial-gradient(ellipse 40% 52% at 74% 61%, #000 0%, #000 30%, rgba(0,0,0,.86) 47%, rgba(0,0,0,.50) 64%, rgba(0,0,0,.20) 80%, transparent 97%);\n        mask-image:\n          radial-gradient(ellipse 45% 31% at 74% 27%, #000 0%, #000 34%, rgba(0,0,0,.88) 51%, rgba(0,0,0,.54) 67%, rgba(0,0,0,.22) 82%, transparent 97%),\n          radial-gradient(ellipse 40% 52% at 74% 61%, #000 0%, #000 30%, rgba(0,0,0,.86) 47%, rgba(0,0,0,.50) 64%, rgba(0,0,0,.20) 80%, transparent 97%);\n      }'''

          new_mobile='''      .current .cover-subject-detail{\n        top:0;\n        right:0;\n        width:38%;\n        height:31%;\n        background-size:380% auto;\n        background-position:89% 64%;\n        filter:blur(.18px) saturate(1.14) contrast(1.06);\n        -webkit-filter:blur(.18px) saturate(1.14) contrast(1.06);\n        -webkit-mask-image:\n          radial-gradient(ellipse 44% 30% at 78% 22%, #000 0%, #000 43%, rgba(0,0,0,.90) 56%, rgba(0,0,0,.64) 70%, rgba(0,0,0,.30) 83%, rgba(0,0,0,.10) 92%, transparent 100%),\n          radial-gradient(ellipse 41% 51% at 76% 62%, #000 0%, #000 39%, rgba(0,0,0,.88) 53%, rgba(0,0,0,.58) 68%, rgba(0,0,0,.26) 82%, rgba(0,0,0,.08) 92%, transparent 100%);\n        mask-image:\n          radial-gradient(ellipse 44% 30% at 78% 22%, #000 0%, #000 43%, rgba(0,0,0,.90) 56%, rgba(0,0,0,.64) 70%, rgba(0,0,0,.30) 83%, rgba(0,0,0,.10) 92%, transparent 100%),\n          radial-gradient(ellipse 41% 51% at 76% 62%, #000 0%, #000 39%, rgba(0,0,0,.88) 53%, rgba(0,0,0,.58) 68%, rgba(0,0,0,.26) 82%, rgba(0,0,0,.08) 92%, transparent 100%);\n      }'''
          if old_mobile not in s:
              raise SystemExit('v46 mobile subject css not found')
          s=s.replace(old_mobile,new_mobile,1)
          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text()
          if 'const CACHE_NAME = "ipcdj-worship-v46";' not in t:
              raise SystemExit('expected v46 cache marker not found')
          sw.write_text(t.replace('const CACHE_NAME = "ipcdj-worship-v46";','const CACHE_NAME = "ipcdj-worship-v47";',1))

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          block='''\n\n## Person visibility and seamless blending v47\n\nThe approved person treatment must keep the person as visible and prominent as the approved v45 framing. Do not solve seams by enlarging, relocating, or washing out the subject layer. Preserve the approved subject crop/placement and remove visible separation only through soft alpha feathering around the isolated person. No hard clip-path, rectangular crop edge, or abrupt layer boundary may be visible on desktop, mobile, tablet, PWA, or narrow layouts. Mobile may use its approved crop dimensions, but the person must remain clearly visible and dissolve smoothly into the centered album-cover atmosphere.\n'''
          if '## Person visibility and seamless blending v47' not in u:
              u += block
          st.write_text(u)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Restore approved person visibility and feather seams"
          git push origin main
