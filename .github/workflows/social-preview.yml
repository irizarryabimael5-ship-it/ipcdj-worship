name: IPCDJ Social Preview Verify

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'social-preview-v180.jpg'
      - 'social-preview-live.jpg'
      - '.github/workflows/social-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipcdj-social-preview
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install preview validator
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Validate current WhatsApp preview asset
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          from urllib.parse import urlparse

          html=Path('index.html').read_text(encoding='utf-8')
          match=re.search(r'property="og:image" content="([^"]+)"',html)
          assert match, 'og:image missing'
          image_url=match.group(1)
          assert image_url.startswith('https://worship.ipcdj.org/'), image_url

          parsed=urlparse(image_url)
          filename=Path(parsed.path).name
          assert filename in {'social-preview-v180.jpg','social-preview-live.jpg'}, filename
          p=Path(filename)
          assert p.exists(), f'{filename} is referenced but missing'

          data=p.read_bytes()
          im=Image.open(p)
          im.load()
          assert im.size==(1200,630), im.size
          assert im.mode=='RGB', im.mode
          assert 10_000 < len(data) < 400_000, len(data)

          for marker in (
              'property="og:image"',
              'property="og:image:url"',
              'property="og:image:secure_url"',
              'name="twitter:image"',
              'rel="image_src"',
              'itemprop="image"',
          ):
              assert image_url in next(
                  line for line in html.splitlines()
                  if marker in line
              ), marker

          assert 'property="og:image:type" content="image/jpeg"' in html
          assert 'property="og:image:width" content="1200"' in html
          assert 'property="og:image:height" content="630"' in html
          print('current WhatsApp preview verified',filename,im.size,len(data),image_url)
          PY
