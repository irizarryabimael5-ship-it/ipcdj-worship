name: IPCDJ Social Preview Build

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/generate-social-preview.py'
      - '.github/workflows/social-preview.yml'
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipcdj-social-preview
  cancel-in-progress: true

jobs:
  render-preview:
    if: github.event_name == 'schedule' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Render sRGB social landing snapshot
        run: python scripts/generate-social-preview.py

      - name: Validate preview
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('social-preview-v176.jpg')
          im=Image.open(p)
          assert im.size==(1200,630), im.size
          assert im.mode=='RGB', im.mode
          assert im.info.get('icc_profile'), 'missing embedded ICC profile'
          assert 10_000 < p.stat().st_size < 400_000, p.stat().st_size
          print('social preview ok', im.size, p.stat().st_size, 'icc', len(im.info['icc_profile']))
          PY

      - name: Commit generated preview
        run: |
          if git diff --quiet -- social-preview-v176.jpg && git ls-files --error-unmatch social-preview-v176.jpg >/dev/null 2>&1; then
            echo "Preview unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview-v176.jpg
          git commit -m "Generate v176 social landing snapshot [skip social-preview]"
          git push
