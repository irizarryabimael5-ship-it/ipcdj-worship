name: IPCDJ Social Preview Verify

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'social-preview-v180.jpg'
      - '.github/workflows/social-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipcdj-social-preview
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install preview validator
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Validate approved WhatsApp preview
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          p=Path('social-preview-v180.jpg')
          expected='b96bd5ee2a1bd28e1a3bdabe41e23b1bd94f9a3b56ad48bf286090b5984fbc21'
          data=p.read_bytes()
          actual=hashlib.sha256(data).hexdigest()
          assert actual==expected, (actual, expected)

          im=Image.open(p)
          im.load()
          assert im.size==(1200,630), im.size
          assert im.mode=='RGB', im.mode
          assert im.info.get('icc_profile'), 'missing embedded ICC profile'
          assert 10_000 < len(data) < 400_000, len(data)

          html=Path('index.html').read_text(encoding='utf-8')
          image_url='https://worship.ipcdj.org/social-preview-v180.jpg?v=180'
          assert f'property="og:image" content="{image_url}"' in html
          assert f'property="og:image:url" content="{image_url}"' in html
          assert f'property="og:image:secure_url" content="{image_url}"' in html
          assert f'name="twitter:image" content="{image_url}"' in html
          assert f'rel="image_src" href="{image_url}"' in html
          assert f'itemprop="image" content="{image_url}"' in html
          print('approved WhatsApp preview verified', im.size, len(data), actual)
          PY
