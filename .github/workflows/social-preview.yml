name: IPCDJ Social Preview Build

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/generate-social-preview.py'
      - '.github/workflows/social-preview.yml'
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ipcdj-social-preview
  cancel-in-progress: true

jobs:
  render-preview:
    if: github.event_name == 'schedule' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install preview dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Render sRGB browser landing snapshot
        run: python scripts/generate-social-preview.py

      - name: Validate preview
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('social-preview-v176.jpg')
          im=Image.open(p)
          assert im.size==(1200,630), im.size
          assert im.mode=='RGB', im.mode
          assert im.info.get('icc_profile'), 'missing embedded ICC profile'
          assert 10_000 < p.stat().st_size < 400_000, p.stat().st_size
          print('social preview ok', im.size, p.stat().st_size, 'icc', len(im.info['icc_profile']))
          PY

      - name: Commit generated preview
        id: commit_preview
        run: |
          if git diff --quiet -- social-preview-v176.jpg && git ls-files --error-unmatch social-preview-v176.jpg >/dev/null 2>&1; then
            echo "Preview unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview-v176.jpg
          git commit -m "Generate v178 browser landing snapshot [skip social-preview]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify generated preview is live
        if: steps.commit_preview.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(sha256sum social-preview-v176.jpg | awk '{print $1}')"
          echo "Waiting for generated social preview: $EXPECTED"
          for attempt in $(seq 1 36); do
            nonce="${GITHUB_RUN_ID}-${attempt}"
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://worship.ipcdj.org/social-preview-v176.jpg?social-deploy=${nonce}" \
              -o /tmp/ipcdj-social-live; then
              LIVE="$(sha256sum /tmp/ipcdj-social-live | awk '{print $1}')"
              if [ "$LIVE" = "$EXPECTED" ]; then
                echo "Generated preview is live on attempt $attempt."
                exit 0
              fi
              echo "Attempt $attempt: live=$LIVE expected=$EXPECTED"
            fi
            sleep 10
          done
          echo "Timed out waiting for generated social preview deployment."
          exit 1

      - name: Dispatch final website health on generated head
        if: steps.commit_preview.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-health.yml --ref main
