name: One-time cover detail v37

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-cover-detail-v37.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add selective album-art detail fade
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('content="blurred-cover-v36"','content="cover-detail-v37"',1)

          anchor='''    .current > *{\n      position:relative;\n      z-index:1;\n    }'''
          repl='''    .current > *{\n      position:relative;\n      z-index:1;\n    }\n\n    .current .cover-detail{\n      position:absolute;\n      inset:-2px;\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:cover;\n      background-position:center;\n      background-repeat:no-repeat;\n      filter:blur(4px) saturate(1.08) contrast(1.03);\n      -webkit-filter:blur(4px) saturate(1.08) contrast(1.03);\n      opacity:.30;\n      transform:scale(1.035);\n      -webkit-mask-image:\n        radial-gradient(ellipse 34% 26% at 88% 16%, #000 0%, rgba(0,0,0,.88) 32%, rgba(0,0,0,.38) 62%, transparent 100%),\n        radial-gradient(ellipse 26% 22% at 10% 90%, #000 0%, rgba(0,0,0,.70) 36%, transparent 100%);\n      mask-image:\n        radial-gradient(ellipse 34% 26% at 88% 16%, #000 0%, rgba(0,0,0,.88) 32%, rgba(0,0,0,.38) 62%, transparent 100%),\n        radial-gradient(ellipse 26% 22% at 10% 90%, #000 0%, rgba(0,0,0,.70) 36%, transparent 100%);\n      -webkit-mask-composite:source-over;\n      mask-composite:add;\n      transition:opacity .9s ease;\n    }\n\n    @media (max-width:640px){\n      .current .cover-detail{\n        opacity:.22;\n        background-position:58% center;\n        -webkit-mask-image:\n          radial-gradient(ellipse 30% 18% at 90% 10%, #000 0%, rgba(0,0,0,.70) 34%, transparent 100%),\n          radial-gradient(ellipse 24% 16% at 8% 94%, #000 0%, rgba(0,0,0,.55) 34%, transparent 100%);\n        mask-image:\n          radial-gradient(ellipse 30% 18% at 90% 10%, #000 0%, rgba(0,0,0,.70) 34%, transparent 100%),\n          radial-gradient(ellipse 24% 16% at 8% 94%, #000 0%, rgba(0,0,0,.55) 34%, transparent 100%);\n      }\n    }\n\n    @media (prefers-reduced-transparency: reduce){\n      .current .cover-detail{opacity:.12}\n    }'''
          if anchor not in s: raise SystemExit('current child anchor not found')
          s=s.replace(anchor,repl,1)

          html_anchor='<section class="card current reveal" id="current-song-card">\n'
          html_repl='<section class="card current reveal" id="current-song-card">\n      <div class="cover-detail" aria-hidden="true"></div>\n'
          if html_anchor not in s: raise SystemExit('current card html anchor not found')
          s=s.replace(html_anchor,html_repl,1)

          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text().replace('const CACHE_NAME = "ipcdj-worship-v36";','const CACHE_NAME = "ipcdj-worship-v37";',1)
          sw.write_text(t)

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          block='''\n\n## Selective official-art detail fade\n\nThe current-song card may allow small portions of the official album artwork to become softly recognizable in low-content regions while the main card remains a blurred atmospheric treatment.\n\nRequired behavior:\n- Keep the full-card artwork layer heavily blurred as the primary atmosphere.\n- Add only a low-opacity, lightly blurred detail layer from the same official cover.\n- Reveal that detail through feathered masks concentrated near card edges/corners where it is least likely to compete with text.\n- On narrow/mobile layouts, reduce the detail opacity and tighten the masks because text occupies more of the card width.\n- Never place crisp artwork directly behind primary title, artist, countdown, progress, or timeline text.\n- Semantic stage colors remain independent of artwork.\n- The page-wide moving ambient background remains untouched.\n- If reduced-transparency is requested, substantially reduce the detail layer.\n'''
          if '## Selective official-art detail fade' not in u:
              u += block
          st.write_text(u)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Add selective album-art detail fade to current card"
          git push origin main
