name: One-time current-person art v42

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-current-person-art-v42.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace generic face detection with current-song art-directed person reveal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('content="person-aware-cover-v41"','content="current-person-art-v42"',1)

          # Remove generic subject cache constant. We are testing one art-directed result first.
          s=s.replace('    const COVER_SUBJECT_CACHE_PREFIX="ipcdj-cover-subject-v1:";\n','',1)

          # Strengthen the dedicated subject layer so the current person reads almost fully at the edge.
          old='''    .current .cover-subject-detail{\n      position:absolute;\n      inset:-6%;\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:cover;\n      background-position:var(--cover-pos-x) var(--cover-pos-y);\n      background-repeat:no-repeat;\n      filter:blur(.9px) saturate(1.10) contrast(1.05);\n      -webkit-filter:blur(.9px) saturate(1.10) contrast(1.05);\n      opacity:var(--subject-opacity);\n      transform:translate3d(var(--subject-shift-x),var(--subject-shift-y),0) scale(1.045);\n      transform-origin:center;\n      -webkit-mask-image:radial-gradient(ellipse 20% 26% at var(--subject-mask-x) var(--subject-mask-y), #000 0%, rgba(0,0,0,.95) 28%, rgba(0,0,0,.72) 52%, rgba(0,0,0,.30) 72%, transparent 100%);\n      mask-image:radial-gradient(ellipse 20% 26% at var(--subject-mask-x) var(--subject-mask-y), #000 0%, rgba(0,0,0,.95) 28%, rgba(0,0,0,.72) 52%, rgba(0,0,0,.30) 72%, transparent 100%);\n      transition:opacity .8s ease,transform .8s ease;\n      will-change:opacity,transform;\n    }'''
          new='''    .current .cover-subject-detail{\n      position:absolute;\n      inset:-5%;\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:cover;\n      background-position:var(--cover-pos-x) var(--cover-pos-y);\n      background-repeat:no-repeat;\n      filter:blur(.35px) saturate(1.12) contrast(1.06);\n      -webkit-filter:blur(.35px) saturate(1.12) contrast(1.06);\n      opacity:var(--subject-opacity);\n      transform:translate3d(var(--subject-shift-x),var(--subject-shift-y),0) scale(1.035);\n      transform-origin:center;\n      -webkit-mask-image:\n        radial-gradient(ellipse 27% 34% at var(--subject-mask-x) var(--subject-mask-y), #000 0%, #000 34%, rgba(0,0,0,.90) 54%, rgba(0,0,0,.56) 74%, rgba(0,0,0,.16) 90%, transparent 100%),\n        linear-gradient(270deg,#000 0%,rgba(0,0,0,.96) 9%,rgba(0,0,0,.56) 20%,transparent 35%);\n      mask-image:\n        radial-gradient(ellipse 27% 34% at var(--subject-mask-x) var(--subject-mask-y), #000 0%, #000 34%, rgba(0,0,0,.90) 54%, rgba(0,0,0,.56) 74%, rgba(0,0,0,.16) 90%, transparent 100%),\n        linear-gradient(270deg,#000 0%,rgba(0,0,0,.96) 9%,rgba(0,0,0,.56) 20%,transparent 35%);\n      -webkit-mask-composite:source-over;\n      mask-composite:add;\n      transition:opacity .8s ease,transform .8s ease;\n      will-change:opacity,transform;\n    }'''
          if old not in s: raise SystemExit('subject detail css block not found')
          s=s.replace(old,new,1)

          # The mobile version still shows the subject clearly, but not quite as hard as desktop.
          s=s.replace('''      .current .cover-subject-detail{\n        filter:blur(1.25px) saturate(1.08) contrast(1.04);\n        -webkit-filter:blur(1.25px) saturate(1.08) contrast(1.04);\n      }''','''      .current .cover-subject-detail{\n        filter:blur(.65px) saturate(1.10) contrast(1.05);\n        -webkit-filter:blur(.65px) saturate(1.10) contrast(1.05);\n      }''',1)

          # Replace the automatic face-detection system with one temporary, art-directed current-song trial.
          pattern=re.compile(r'''    function normalizeSubjectFocus\(value\)\{.*?    function loadPaletteFromArtwork\(url\)\{''',re.S)
          replacement='''    function applyCurrentSongSubjectArt(song){\n      const card=$("current-song-card");\n      if(!card)return;\n      resetCoverSubject(card);\n\n      // Trial art direction for the CURRENT cover only.\n      // The base cover remains centered; this second copy is gently shifted so a person\n      // from the artwork can live almost fully at the right edge where there is less text.\n      if(song.id!=="dios-de-milagros")return;\n      card.style.setProperty("--subject-shift-x","9.0%");\n      card.style.setProperty("--subject-shift-y","1.5%");\n      card.style.setProperty("--subject-mask-x","91%");\n      card.style.setProperty("--subject-mask-y","68%");\n      card.style.setProperty("--subject-opacity",".82");\n      card.dataset.coverSubject="trial-dios-de-milagros-right-edge";\n    }\n\n    function loadPaletteFromArtwork(url){'''
          s2,n=pattern.subn(replacement,s,count=1)
          if n!=1: raise SystemExit(f'generic subject detection block replacement count={n}')
          s=s2

          s=s.replace('''        applyCoverArtwork(song,artworkUrl);\n        ensureCoverSubject(song,artworkUrl,token);''','''        applyCoverArtwork(song,artworkUrl);\n        applyCurrentSongSubjectArt(song);''',1)

          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text().replace('const CACHE_NAME = "ipcdj-worship-v41";','const CACHE_NAME = "ipcdj-worship-v42";',1)
          sw.write_text(t)

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          block='''\n\n## Current-cover person art-direction trial\n\nBefore enabling automatic person detection globally, test and visually approve the treatment on the currently active song.\n\nCurrent trial behavior:\n- Preserve the centered official-cover atmosphere, selective empty-space reveals, and strong perimeter artwork exactly as the established base treatment.\n- Add one separate near-crisp subject-detail copy only for the current Dios De Milagros cover.\n- Shift that extra copy slightly toward the right edge and reveal it through a broad feathered right-edge mask so a person from the cover can read almost fully without covering primary text.\n- Keep the central/title/countdown/progress/timeline content treatment unchanged.\n- Do not enable generic automatic face/person detection until the visual result is approved.\n'''
          if '## Current-cover person art-direction trial' not in u:
              u += block
          st.write_text(u)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Art-direct current cover person reveal for approval"
          git push origin main
