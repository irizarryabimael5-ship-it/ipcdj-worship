name: One-time perimeter cover v40

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-perimeter-cover-v40.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Strengthen centered album-cover presence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('content="centered-cover-v39"','content="perimeter-cover-v40"',1)

          css_anchor='''      transition:opacity .9s ease;\n    }\n\n    .current .countdown-wrap,'''
          css_insert='''      transition:opacity .9s ease;\n    }\n\n    .current .cover-edge-detail{\n      position:absolute;\n      inset:-3px;\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:cover;\n      background-position:var(--cover-pos-x) var(--cover-pos-y);\n      background-repeat:no-repeat;\n      filter:blur(1.6px) saturate(1.12) contrast(1.05);\n      -webkit-filter:blur(1.6px) saturate(1.12) contrast(1.05);\n      opacity:.50;\n      transform:scale(1.018);\n      -webkit-mask-image:radial-gradient(ellipse 74% 70% at 50% 50%, transparent 0%, transparent 54%, rgba(0,0,0,.18) 63%, rgba(0,0,0,.58) 76%, #000 100%);\n      mask-image:radial-gradient(ellipse 74% 70% at 50% 50%, transparent 0%, transparent 54%, rgba(0,0,0,.18) 63%, rgba(0,0,0,.58) 76%, #000 100%);\n      transition:opacity .9s ease;\n    }\n\n    .current .cover-edge-detail::after{\n      content:\"\";\n      position:absolute;\n      inset:0;\n      background:\n        linear-gradient(180deg, rgba(4,7,12,.08) 0%, rgba(4,7,12,0) 18%, rgba(4,7,12,0) 82%, rgba(4,7,12,.10) 100%),\n        linear-gradient(90deg, rgba(4,7,12,.07) 0%, rgba(4,7,12,0) 13%, rgba(4,7,12,0) 87%, rgba(4,7,12,.07) 100%);\n    }\n\n    .current .countdown-wrap,'''
          if css_anchor not in s: raise SystemExit('detail layer anchor not found')
          s=s.replace(css_anchor,css_insert,1)

          mobile_anchor='''    @media (max-width:640px){\n      .current .cover-detail{'''
          mobile_repl='''    @media (max-width:640px){\n      .current .cover-edge-detail{\n        opacity:.40;\n        background-position:var(--cover-pos-x) var(--cover-pos-y);\n        -webkit-mask-image:radial-gradient(ellipse 80% 74% at 50% 50%, transparent 0%, transparent 58%, rgba(0,0,0,.18) 67%, rgba(0,0,0,.50) 79%, #000 100%);\n        mask-image:radial-gradient(ellipse 80% 74% at 50% 50%, transparent 0%, transparent 58%, rgba(0,0,0,.18) 67%, rgba(0,0,0,.50) 79%, #000 100%);\n      }\n\n      .current .cover-detail{'''
          if mobile_anchor not in s: raise SystemExit('mobile anchor not found')
          s=s.replace(mobile_anchor,mobile_repl,1)

          reduce_anchor='''    @media (prefers-reduced-transparency: reduce){\n      .current .cover-detail{opacity:.14}'''
          reduce_repl='''    @media (prefers-reduced-transparency: reduce){\n      .current .cover-detail{opacity:.14}\n      .current .cover-edge-detail{opacity:.18}'''
          if reduce_anchor not in s: raise SystemExit('reduced transparency anchor not found')
          s=s.replace(reduce_anchor,reduce_repl,1)

          html_anchor='''      <div class="cover-detail" aria-hidden="true"></div>\n      <div class="status"'''
          html_repl='''      <div class="cover-detail" aria-hidden="true"></div>\n      <div class="cover-edge-detail" aria-hidden="true"></div>\n      <div class="status"'''
          if html_anchor not in s: raise SystemExit('current card detail html anchor not found')
          s=s.replace(html_anchor,html_repl,1)

          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text().replace('const CACHE_NAME = "ipcdj-worship-v39";','const CACHE_NAME = "ipcdj-worship-v40";',1)
          sw.write_text(t)

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          block='''\n\n## Unmistakable centered album-cover presence\n\nThe active-song card must visibly read as being built from the official centered album artwork, not merely as a generic color tint.\n\nRequired behavior:\n- The official cover remains centered at 50% / 50% and is the single source image for all card-art layers.\n- Preserve the heavily blurred full-card atmosphere layer.\n- Preserve strategic lightly blurred detail reveals in low-content regions.\n- Add a dedicated perimeter-detail layer that reveals noticeably more recognizable artwork toward all four edges and corners while fading inward before it competes with primary content.\n- The outer perimeter should make the cover unmistakable at a glance, while the central content region stays calmer and darker.\n- Mobile keeps the same centered crop and a slightly softer perimeter reveal.\n- Text, countdown, progress, timeline, semantic stage colors, and the page-wide animated ambient background remain independent and readable.\n'''
          if '## Unmistakable centered album-cover presence' not in u:
              u += block
          st.write_text(u)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Make centered album artwork unmistakable around current-card perimeter"
          git push origin main
