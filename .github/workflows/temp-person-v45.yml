name: One-time isolated person v45

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-person-v45.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine current-cover isolated person trial
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('content="top-band-person-v44"','content="isolated-person-v45"',1)

          old_vars='''      --subject-bg-x:74%;\n      --subject-bg-y:78%;\n      --subject-opacity:0;'''
          new_vars='''      --subject-width:32%;\n      --subject-height:36%;\n      --subject-bg-x:88%;\n      --subject-bg-y:64%;\n      --subject-bg-size:320%;\n      --subject-opacity:0;'''
          if old_vars not in s: raise SystemExit('v44 subject vars not found')
          s=s.replace(old_vars,new_vars,1)

          old_css='''    .current .cover-subject-detail{\n      position:absolute;\n      top:0;\n      right:0;\n      left:0;\n      height:34%;\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:142% auto;\n      background-position:var(--subject-bg-x) var(--subject-bg-y);\n      background-repeat:no-repeat;\n      filter:blur(.12px) saturate(1.14) contrast(1.08);\n      -webkit-filter:blur(.12px) saturate(1.14) contrast(1.08);\n      opacity:var(--subject-opacity);\n      transform:none;\n      transform-origin:center;\n      clip-path:inset(0 0 0 0 round 26px 26px 0 0);\n      -webkit-clip-path:inset(0 0 0 0 round 26px 26px 0 0);\n      -webkit-mask-image:\n        radial-gradient(ellipse 7% 11% at 90% 15%, #000 0%, #000 56%, rgba(0,0,0,.72) 74%, transparent 100%),\n        radial-gradient(ellipse 11% 24% at 90% 30%, #000 0%, #000 48%, rgba(0,0,0,.82) 68%, rgba(0,0,0,.30) 86%, transparent 100%),\n        linear-gradient(270deg, #000 0%, rgba(0,0,0,.90) 9%, rgba(0,0,0,.34) 18%, transparent 28%);\n      mask-image:\n        radial-gradient(ellipse 7% 11% at 90% 15%, #000 0%, #000 56%, rgba(0,0,0,.72) 74%, transparent 100%),\n        radial-gradient(ellipse 11% 24% at 90% 30%, #000 0%, #000 48%, rgba(0,0,0,.82) 68%, rgba(0,0,0,.30) 86%, transparent 100%),\n        linear-gradient(270deg, #000 0%, rgba(0,0,0,.90) 9%, rgba(0,0,0,.34) 18%, transparent 28%);\n      -webkit-mask-composite:source-over;\n      mask-composite:add;\n      transition:opacity .8s ease;\n      will-change:opacity;\n    }'''
          new_css='''    .current .cover-subject-detail{\n      position:absolute;\n      top:0;\n      right:0;\n      width:var(--subject-width);\n      height:var(--subject-height);\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:var(--subject-bg-size) auto;\n      background-position:var(--subject-bg-x) var(--subject-bg-y);\n      background-repeat:no-repeat;\n      filter:blur(.10px) saturate(1.16) contrast(1.08);\n      -webkit-filter:blur(.10px) saturate(1.16) contrast(1.08);\n      opacity:var(--subject-opacity);\n      transform:none;\n      transform-origin:top right;\n      overflow:hidden;\n      border-top-right-radius:28px;\n      clip-path:inset(0 0 0 0 round 0 28px 0 0);\n      -webkit-clip-path:inset(0 0 0 0 round 0 28px 0 0);\n      -webkit-mask-image:\n        radial-gradient(ellipse 34% 18% at 78% 18%, #000 0%, #000 54%, rgba(0,0,0,.82) 70%, rgba(0,0,0,.22) 88%, transparent 100%),\n        radial-gradient(ellipse 30% 34% at 76% 58%, #000 0%, #000 52%, rgba(0,0,0,.84) 70%, rgba(0,0,0,.24) 88%, transparent 100%),\n        linear-gradient(270deg, #000 0%, rgba(0,0,0,.96) 18%, rgba(0,0,0,.52) 34%, transparent 52%),\n        linear-gradient(180deg, #000 0%, rgba(0,0,0,.92) 18%, rgba(0,0,0,.48) 36%, transparent 56%);\n      mask-image:\n        radial-gradient(ellipse 34% 18% at 78% 18%, #000 0%, #000 54%, rgba(0,0,0,.82) 70%, rgba(0,0,0,.22) 88%, transparent 100%),\n        radial-gradient(ellipse 30% 34% at 76% 58%, #000 0%, #000 52%, rgba(0,0,0,.84) 70%, rgba(0,0,0,.24) 88%, transparent 100%),\n        linear-gradient(270deg, #000 0%, rgba(0,0,0,.96) 18%, rgba(0,0,0,.52) 34%, transparent 52%),\n        linear-gradient(180deg, #000 0%, rgba(0,0,0,.92) 18%, rgba(0,0,0,.48) 36%, transparent 56%);\n      -webkit-mask-composite:source-over;\n      mask-composite:add;\n      transition:opacity .8s ease;\n      will-change:opacity;\n    }'''
          if old_css not in s: raise SystemExit('v44 subject css not found')
          s=s.replace(old_css,new_css,1)

          old_mobile='''      .current .cover-subject-detail{\n        height:29%;\n        background-size:156% auto;\n        filter:blur(.24px) saturate(1.12) contrast(1.06);\n        -webkit-filter:blur(.24px) saturate(1.12) contrast(1.06);\n        -webkit-mask-image:\n          radial-gradient(ellipse 8% 12% at 90% 16%, #000 0%, #000 56%, rgba(0,0,0,.72) 74%, transparent 100%),\n          radial-gradient(ellipse 12% 26% at 90% 31%, #000 0%, #000 48%, rgba(0,0,0,.82) 68%, rgba(0,0,0,.28) 86%, transparent 100%),\n          linear-gradient(270deg, #000 0%, rgba(0,0,0,.88) 11%, rgba(0,0,0,.28) 20%, transparent 31%);\n        mask-image:\n          radial-gradient(ellipse 8% 12% at 90% 16%, #000 0%, #000 56%, rgba(0,0,0,.72) 74%, transparent 100%),\n          radial-gradient(ellipse 12% 26% at 90% 31%, #000 0%, #000 48%, rgba(0,0,0,.82) 68%, rgba(0,0,0,.28) 86%, transparent 100%),\n          linear-gradient(270deg, #000 0%, rgba(0,0,0,.88) 11%, rgba(0,0,0,.28) 20%, transparent 31%);\n      }'''
          new_mobile='''      .current .cover-subject-detail{\n        width:38%;\n        height:31%;\n        background-size:380% auto;\n        background-position:89% 64%;\n        filter:blur(.18px) saturate(1.14) contrast(1.06);\n        -webkit-filter:blur(.18px) saturate(1.14) contrast(1.06);\n        -webkit-mask-image:\n          radial-gradient(ellipse 36% 19% at 79% 18%, #000 0%, #000 54%, rgba(0,0,0,.82) 70%, rgba(0,0,0,.22) 88%, transparent 100%),\n          radial-gradient(ellipse 31% 36% at 77% 59%, #000 0%, #000 52%, rgba(0,0,0,.84) 70%, rgba(0,0,0,.24) 88%, transparent 100%),\n          linear-gradient(270deg, #000 0%, rgba(0,0,0,.95) 18%, rgba(0,0,0,.48) 34%, transparent 54%),\n          linear-gradient(180deg, #000 0%, rgba(0,0,0,.90) 18%, rgba(0,0,0,.42) 36%, transparent 58%);\n        mask-image:\n          radial-gradient(ellipse 36% 19% at 79% 18%, #000 0%, #000 54%, rgba(0,0,0,.82) 70%, rgba(0,0,0,.22) 88%, transparent 100%),\n          radial-gradient(ellipse 31% 36% at 77% 59%, #000 0%, #000 52%, rgba(0,0,0,.84) 70%, rgba(0,0,0,.24) 88%, transparent 100%),\n          linear-gradient(270deg, #000 0%, rgba(0,0,0,.95) 18%, rgba(0,0,0,.48) 34%, transparent 54%),\n          linear-gradient(180deg, #000 0%, rgba(0,0,0,.90) 18%, rgba(0,0,0,.42) 36%, transparent 58%);\n      }'''
          if old_mobile not in s: raise SystemExit('v44 mobile subject css not found')
          s=s.replace(old_mobile,new_mobile,1)

          old_reset='''    function resetCoverSubject(card){\n      if(!card)return;\n      card.style.setProperty("--subject-opacity","0");\n      card.style.setProperty("--subject-bg-x","74%");\n      card.style.setProperty("--subject-bg-y","78%");\n      delete card.dataset.coverSubject;\n    }'''
          new_reset='''    function resetCoverSubject(card){\n      if(!card)return;\n      card.style.setProperty("--subject-width","32%");\n      card.style.setProperty("--subject-height","36%");\n      card.style.setProperty("--subject-bg-x","88%");\n      card.style.setProperty("--subject-bg-y","64%");\n      card.style.setProperty("--subject-bg-size","320%");\n      card.style.setProperty("--subject-opacity","0");\n      delete card.dataset.coverSubject;\n    }'''
          if old_reset not in s: raise SystemExit('v44 reset function not found')
          s=s.replace(old_reset,new_reset,1)

          old_fn='''    function applyCurrentSongSubjectArt(song){\n      const card=$("current-song-card");\n      if(!card)return;\n      resetCoverSubject(card);\n\n      // Approval trial only for the current Dios De Milagros cover.\n      // Keep the established centered/perimeter base exactly intact; the extra layer is\n      // confined to the empty top band and tuned to reveal only the person area.\n      if(song.id!=="dios-de-milagros")return;\n      card.style.setProperty("--subject-bg-x","74%");\n      card.style.setProperty("--subject-bg-y","78%");\n      card.style.setProperty("--subject-opacity",".96");\n      card.dataset.coverSubject="trial-dios-de-milagros-top-right-person-only-v44";\n    }'''
          new_fn='''    function applyCurrentSongSubjectArt(song){\n      const card=$("current-song-card");\n      if(!card)return;\n      resetCoverSubject(card);\n\n      // Current approval trial for Dios De Milagros: preserve the centered full-cover\n      // atmosphere/reveals, then add only a tightly cropped right-side singer in the empty\n      // top-right corner. This is intentionally not generalized until visually approved.\n      if(song.id!=="dios-de-milagros")return;\n      card.style.setProperty("--subject-width","31%");\n      card.style.setProperty("--subject-height","37%");\n      card.style.setProperty("--subject-bg-x","88%");\n      card.style.setProperty("--subject-bg-y","64%");\n      card.style.setProperty("--subject-bg-size","325%");\n      card.style.setProperty("--subject-opacity",".95");\n      card.dataset.coverSubject="trial-dios-de-milagros-top-right-isolated-person-v45";\n    }'''
          if old_fn not in s: raise SystemExit('v44 current subject function not found')
          s=s.replace(old_fn,new_fn,1)
          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text().replace('const CACHE_NAME = "ipcdj-worship-v44";','const CACHE_NAME = "ipcdj-worship-v45";',1)
          sw.write_text(t)

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          block='''\n\n## Current-cover isolated-person trial v45\n\nFor the current Dios De Milagros approval trial, preserve the centered official-cover atmosphere, strategic empty-space reveals, and perimeter-detail system as the permanent base. The additional subject layer is a tightly cropped top-right window intended to show only the selected person from the same cover, with near-crisp detail and strong opacity, while suppressing surrounding duplicate artwork. This is still a current-song-only art-direction trial and must not be generalized to future songs until visually approved.\n'''
          if '## Current-cover isolated-person trial v45' not in u:
              u += block
          st.write_text(u)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Refine current cover into isolated top-right person trial"
          git push origin main
