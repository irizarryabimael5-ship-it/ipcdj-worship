name: Build STEM Live Native 0.6.1

on:
  push:
    branches: [stem-live-native-061]
    paths:
      - 'native-stem-live/**'
      - '.github/workflows/stem-live-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: native-stem-live
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stem-live-native-061

      - name: Toolchain
        run: |
          xcodebuild -version
          swiftc --version
          ls -la Sources

      - name: Build Apple Silicon
        run: |
          set -euo pipefail
          mkdir -p build/arm build/app/'STEM Live Native.app'/Contents/MacOS build/app/'STEM Live Native.app'/Contents/Resources
          xcrun swiftc -O -whole-module-optimization -parse-as-library \
            -target arm64-apple-macos13.0 \
            -framework SwiftUI -framework AppKit -framework AVFoundation -framework Accelerate -framework QuartzCore -framework CoreAudio -framework AudioToolbox \
            Sources/*.swift -o build/arm/'STEM Live Native'

      - name: Build Intel
        run: |
          set -euo pipefail
          mkdir -p build/x86
          xcrun swiftc -O -whole-module-optimization -parse-as-library \
            -target x86_64-apple-macos13.0 \
            -framework SwiftUI -framework AppKit -framework AVFoundation -framework Accelerate -framework QuartzCore -framework CoreAudio -framework AudioToolbox \
            Sources/*.swift -o build/x86/'STEM Live Native'

      - name: Universal app
        run: |
          set -euo pipefail
          lipo -create build/x86/'STEM Live Native' build/arm/'STEM Live Native' -output build/app/'STEM Live Native.app'/Contents/MacOS/'STEM Live Native'
          cp Info.plist build/app/'STEM Live Native.app'/Contents/Info.plist
          chmod +x build/app/'STEM Live Native.app'/Contents/MacOS/'STEM Live Native'
          plutil -lint build/app/'STEM Live Native.app'/Contents/Info.plist
          lipo -info build/app/'STEM Live Native.app'/Contents/MacOS/'STEM Live Native'
          codesign --force --deep --sign - build/app/'STEM Live Native.app'
          codesign --verify --deep --strict --verbose=2 build/app/'STEM Live Native.app'

      - name: Build PKG and DMG
        run: |
          set -euo pipefail

          pkgbuild \
            --component build/app/'STEM Live Native.app' \
            --install-location /Applications \
            --identifier org.ipcdj.stemlive.nativepreview.pkg \
            --version 0.6.1 \
            build/STEM_Live_Native_0.6.1.pkg
          xar -tf build/STEM_Live_Native_0.6.1.pkg

          mkdir -p build/dmg-stage
          ditto build/app/'STEM Live Native.app' build/dmg-stage/'STEM Live Native.app'
          ln -s /Applications build/dmg-stage/Applications
          hdiutil create \
            -volname 'STEM Live Native 0.6.1' \
            -srcfolder build/dmg-stage \
            -ov -format UDZO \
            build/STEM_Live_Native_0.6.1.dmg
          hdiutil verify build/STEM_Live_Native_0.6.1.dmg

          ditto -c -k --keepParent build/app/'STEM Live Native.app' build/STEM_Live_Native_0.6.1_App.zip
          ditto -c -k build/STEM_Live_Native_0.6.1.pkg build/STEM_Live_Native_0.6.1_PKG.zip

          shasum -a 256 \
            build/STEM_Live_Native_0.6.1.dmg \
            build/STEM_Live_Native_0.6.1.pkg \
            build/STEM_Live_Native_0.6.1_App.zip \
            build/STEM_Live_Native_0.6.1_PKG.zip | tee build/SHA256.txt

      - name: Upload native release
        uses: actions/upload-artifact@v4
        with:
          name: STEM-Live-Native-0.6.1
          path: |
            native-stem-live/build/STEM_Live_Native_0.6.1.dmg
            native-stem-live/build/STEM_Live_Native_0.6.1.pkg
            native-stem-live/build/STEM_Live_Native_0.6.1_PKG.zip
            native-stem-live/build/STEM_Live_Native_0.6.1_App.zip
            native-stem-live/build/SHA256.txt
          if-no-files-found: error
