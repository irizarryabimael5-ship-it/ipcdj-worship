name: Build STEM Live Native 0.6.6

on:
  push:
    branches: [stem-live-native-066]
    paths:
      - 'native-stem-live/**'
      - '.github/workflows/stem-live-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stem-live-native-066
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: native-stem-live

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stem-live-native-066

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swiftc --version
          go version
          ls -la Sources

      - name: Build Legacy Alpha migration helper
        run: |
          set -euo pipefail
          cd legacy-migrator
          for attempt in 1 2 3; do
            if go mod tidy; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Go module verification timed out; retrying in $((attempt * 4)) seconds…"
            sleep $((attempt * 4))
          done
          mkdir -p ../build/helpers
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../build/helpers/legacy-migrator-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../build/helpers/legacy-migrator-x86_64 .
          cd ..
          lipo -create build/helpers/legacy-migrator-arm64 build/helpers/legacy-migrator-x86_64 -output build/helpers/legacy-migrator
          chmod +x build/helpers/legacy-migrator
          lipo -info build/helpers/legacy-migrator

      - name: Static stability audit
        run: |
          set -euo pipefail
          if grep -R -nE 'try!|fatalError\\(|\\.first!|\\.last!|raw\\.baseAddress!| as! ' Sources; then
            echo "Unsafe force operation found in native source."
            exit 1
          fi
          grep -R -n '0.6.6' Info.plist Sources/ContentView.swift >/dev/null
          grep -n 'engine.connect(clickNode, to: clickMixer, format: clickFormat)' Sources/AudioEngineController.swift >/dev/null
          if grep -n 'engine.connect(clickNode, to: clickMixer, format: nil)' Sources/AudioEngineController.swift; then
            echo "Regression: generated click player must never negotiate an implicit channel format."
            exit 1
          fi
          if grep -n 'installTap' Sources/AudioEngineController.swift; then
            echo "Regression: live audio render taps are not allowed in 0.6.6."
            exit 1
          fi
          if grep -nE 'AVAudioUnitReverb|AVAudioUnitEffect' Sources/AudioEngineController.swift; then
            echo "Regression: inline effects are not allowed in the live program path."
            exit 1
          fi
          grep -n 'AudioPerformanceState' Sources/AudioEngineController.swift >/dev/null
          test -f Sources/StemSyncAnalyzer.swift
          test -f Sources/StemNaming.swift
          grep -n 'visualEnvelope' Sources/WaveformBuilder.swift >/dev/null

      - name: Runtime multistem audio smoke test
        run: |
          set -euo pipefail
          mkdir -p build/smoke
          xcrun swiftc -O \
            -framework AVFoundation -framework AudioToolbox \
            Smoke/AudioGraphSmoke.swift \
            -o build/smoke/audio-graph-smoke
          build/smoke/audio-graph-smoke | tee build/smoke/audio-graph-smoke.log
          grep -q 'STEM LIVE AUDIO SMOKE TEST PASSED' build/smoke/audio-graph-smoke.log

      - name: Generate native macOS app icon
        run: |
          set -euo pipefail
          mkdir -p build/AppIcon.iconset
          cat > build/generate_icon.swift <<'SWIFT'
          import AppKit

          let out = URL(fileURLWithPath: CommandLine.arguments[1], isDirectory: true)
          let specs: [(String, Int)] = [
              ("icon_16x16.png", 16),
              ("icon_16x16@2x.png", 32),
              ("icon_32x32.png", 32),
              ("icon_32x32@2x.png", 64),
              ("icon_128x128.png", 128),
              ("icon_128x128@2x.png", 256),
              ("icon_256x256.png", 256),
              ("icon_256x256@2x.png", 512),
              ("icon_512x512.png", 512),
              ("icon_512x512@2x.png", 1024)
          ]

          func render(size: Int) throws {
              guard let rep = NSBitmapImageRep(
                  bitmapDataPlanes: nil,
                  pixelsWide: size,
                  pixelsHigh: size,
                  bitsPerSample: 8,
                  samplesPerPixel: 4,
                  hasAlpha: true,
                  isPlanar: false,
                  colorSpaceName: .deviceRGB,
                  bytesPerRow: 0,
                  bitsPerPixel: 0
              ) else { throw NSError(domain: "Icon", code: 1) }

              rep.size = NSSize(width: size, height: size)
              guard let context = NSGraphicsContext(bitmapImageRep: rep) else {
                  throw NSError(domain: "Icon", code: 2)
              }

              NSGraphicsContext.saveGraphicsState()
              NSGraphicsContext.current = context

              let side = CGFloat(size)
              let full = NSRect(x: 0, y: 0, width: side, height: side)

              // Full square artwork. Do not pre-mask the macOS icon; Ventura supplies
              // the platform shape, corner radius and system shadow itself.
              let background = NSGradient(colors: [
                  NSColor(calibratedRed: 0.018, green: 0.024, blue: 0.052, alpha: 1),
                  NSColor(calibratedRed: 0.035, green: 0.044, blue: 0.105, alpha: 1),
                  NSColor(calibratedRed: 0.060, green: 0.035, blue: 0.110, alpha: 1)
              ])!
              background.draw(in: full, angle: 82)

              let glowRect = NSRect(
                  x: side * 0.08,
                  y: side * 0.08,
                  width: side * 0.84,
                  height: side * 0.84
              )
              let glow = NSGradient(colors: [
                  NSColor(calibratedRed: 0.06, green: 0.50, blue: 1.0, alpha: 0.72),
                  NSColor(calibratedRed: 0.42, green: 0.24, blue: 0.96, alpha: 0.42),
                  NSColor(calibratedRed: 0.10, green: 0.10, blue: 0.20, alpha: 0.0)
              ])!
              glow.draw(
                  in: NSBezierPath(ovalIn: glowRect),
                  relativeCenterPosition: NSPoint(x: -0.08, y: 0.08)
              )

              // One simple, scalable waveform mark.
              let waveform = NSBezierPath()
              waveform.lineWidth = max(1.25, side * 0.036)
              waveform.lineCapStyle = .round

              let centerX = side * 0.50
              let centerY = side * 0.50
              let xs: [CGFloat] = [-0.245, -0.175, -0.105, -0.035, 0.035, 0.105, 0.175, 0.245]
              let heights: [CGFloat] = [0.17, 0.31, 0.47, 0.62, 0.54, 0.39, 0.26, 0.14]

              for (x, height) in zip(xs, heights) {
                  waveform.move(to: NSPoint(x: centerX + side * x, y: centerY - side * height * 0.5))
                  waveform.line(to: NSPoint(x: centerX + side * x, y: centerY + side * height * 0.5))
              }

              NSColor.white.withAlphaComponent(0.98).setStroke()
              waveform.stroke()

              NSGraphicsContext.restoreGraphicsState()

              guard let png = rep.representation(using: .png, properties: [:]) else {
                  throw NSError(domain: "Icon", code: 3)
              }

              for name in specs.filter({ $0.1 == size }).map({ $0.0 }) {
                  try png.write(to: out.appendingPathComponent(name))
              }
          }

          for size in Set(specs.map { $0.1 }).sorted() {
              try render(size: size)
          }
          SWIFT

          xcrun swift build/generate_icon.swift build/AppIcon.iconset
          iconutil -c icns build/AppIcon.iconset -o build/AppIcon.icns
          file build/AppIcon.icns

      - name: Build Apple Silicon
        run: |
          set -euo pipefail
          mkdir -p build/arm build/app/'STEM Live Native.app'/Contents/MacOS build/app/'STEM Live Native.app'/Contents/Resources/bin
          xcrun swiftc -O -whole-module-optimization -parse-as-library \
            -target arm64-apple-macos13.0 \
            -framework SwiftUI -framework AppKit -framework AVFoundation -framework Accelerate -framework QuartzCore -framework CoreAudio -framework AudioToolbox -framework UniformTypeIdentifiers \
            Sources/*.swift -o build/arm/'STEM Live Native'

      - name: Build Intel
        run: |
          set -euo pipefail
          mkdir -p build/x86
          xcrun swiftc -O -whole-module-optimization -parse-as-library \
            -target x86_64-apple-macos13.0 \
            -framework SwiftUI -framework AppKit -framework AVFoundation -framework Accelerate -framework QuartzCore -framework CoreAudio -framework AudioToolbox -framework UniformTypeIdentifiers \
            Sources/*.swift -o build/x86/'STEM Live Native'

      - name: Assemble universal app
        run: |
          set -euo pipefail
          APP="build/app/STEM Live Native.app"
          lipo -create build/x86/'STEM Live Native' build/arm/'STEM Live Native' -output "$APP/Contents/MacOS/STEM Live Native"
          cp Info.plist "$APP/Contents/Info.plist"
          cp build/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp build/helpers/legacy-migrator "$APP/Contents/Resources/bin/legacy-migrator"
          chmod +x "$APP/Contents/MacOS/STEM Live Native" "$APP/Contents/Resources/bin/legacy-migrator"

          plutil -lint "$APP/Contents/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "0.6.6"
          test "$(plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist")" = "AppIcon"
          file "$APP/Contents/Resources/AppIcon.icns"
          lipo -info "$APP/Contents/MacOS/STEM Live Native"
          lipo -info "$APP/Contents/Resources/bin/legacy-migrator"

          codesign --force --sign - "$APP/Contents/Resources/bin/legacy-migrator"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build PKG and DMG
        run: |
          set -euo pipefail
          APP="build/app/STEM Live Native.app"

          pkgbuild \
            --component "$APP" \
            --install-location /Applications \
            --identifier org.ipcdj.stemlive.nativepreview.pkg \
            --version 0.6.6 \
            build/STEM_Live_Native_0.6.6.pkg
          xar -tf build/STEM_Live_Native_0.6.6.pkg

          rm -rf build/dmg-stage
          mkdir -p build/dmg-stage
          ditto "$APP" build/dmg-stage/'STEM Live Native.app'
          ln -s /Applications build/dmg-stage/Applications
          cat > build/dmg-stage/'INSTALL.txt' <<'TXT'
          STEM Live Native
          ----------------
          Drag "STEM Live Native" to Applications. Replace the existing copy when macOS asks.
          Then eject this disk image and launch STEM Live Native from Applications.
          TXT

          hdiutil create \
            -volname 'STEM Live Native 0.6.6' \
            -srcfolder build/dmg-stage \
            -ov -format UDZO \
            build/STEM_Live_Native_0.6.6.dmg
          hdiutil verify build/STEM_Live_Native_0.6.6.dmg

          ditto -c -k --keepParent "$APP" build/STEM_Live_Native_0.6.6_App.zip
          ditto -c -k build/STEM_Live_Native_0.6.6.pkg build/STEM_Live_Native_0.6.6_PKG.zip

          shasum -a 256 \
            build/STEM_Live_Native_0.6.6.dmg \
            build/STEM_Live_Native_0.6.6.pkg \
            build/STEM_Live_Native_0.6.6_App.zip \
            build/STEM_Live_Native_0.6.6_PKG.zip | tee build/SHA256.txt

      - name: Upload native release
        uses: actions/upload-artifact@v4
        with:
          name: STEM-Live-Native-0.6.6
          path: |
            native-stem-live/build/STEM_Live_Native_0.6.6.dmg
            native-stem-live/build/STEM_Live_Native_0.6.6.pkg
            native-stem-live/build/STEM_Live_Native_0.6.6_PKG.zip
            native-stem-live/build/STEM_Live_Native_0.6.6_App.zip
            native-stem-live/build/SHA256.txt
          if-no-files-found: error
