name: One-time v40 cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-cleanup-v40.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary v40 workflows
        run: |
          rm -f .github/workflows/temp-perimeter-cover-v40.yml
          rm -f .github/workflows/temp-cleanup-v40.yml
          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary v40 workflows"
          git push origin main
