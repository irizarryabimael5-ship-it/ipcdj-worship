name: IPCDJ Requests Staging Deployment — Cloud Only
# Staging-only request Worker. A deploy can be triggered by a dedicated
# user-authorized control-file commit; ordinary pushes never deploy.
on:
  push:
    branches: [staging]
    paths:
      - "requests/worker/deploy-control.json"

permissions:
  contents: read

concurrency:
  group: ipcdj-requests-staging-deploy
  cancel-in-progress: false

jobs:
  staging-deploy:
    name: Requests Worker isolated Staging deployment
    if: "github.ref == 'refs/heads/staging' && startsWith(github.event.head_commit.message, 'Deploy IPCDJ requests Staging: ')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ipcdj-requests-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.IPCDJ_CF_STAGING_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.IPCDJ_CF_STAGING_API_TOKEN }}
      REQUESTS_STAGING_D1_ID: ${{ vars.IPCDJ_REQUESTS_STAGING_D1_ID }}
    defaults:
      run:
        working-directory: requests/worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact authorization and isolation before any external write
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const control=JSON.parse(readFileSync('deploy-control.json','utf8'));
          const config=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          const e=config.env?.staging;
          const binding=e?.d1_databases?.[0];
          const uuid=/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i;
          const id=process.env.REQUESTS_STAGING_D1_ID||'';
          const parent=execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const files=execFileSync('git',['show','--format=','--name-only','HEAD'],{encoding:'utf8'}).trim().split(/\n/);
          if(control.enabled!==true || control.environment!=='staging' || control.approvedTestedSha!==parent)
            throw new Error('Expected explicit authorization for the tested parent SHA');
          if(files.length!==1 || files[0]!=='requests/worker/deploy-control.json')
            throw new Error('Deployment authorization commit changed unrelated files');
          if(!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN)
            throw new Error('Missing GitHub environment Cloudflare credentials');
          if(!uuid.test(id) || id==='00000000-0000-0000-0000-000000000000' ||
             id==='e474b5be-f2a9-4c19-8756-f1adb0a5ef6a')
            throw new Error('Staging D1 ID invalid or existing Web Push ID reused');
          if(config.workers_dev!==false || Object.keys(config.env||{}).join(',')!=='staging' ||
             e?.name!=='ipcdj-song-requests-staging' || e?.workers_dev!==true ||
             e.vars?.APP_ENV!=='staging' ||
             e.vars?.SITE_ORIGIN!=='https://staging.worship.ipcdj.org' ||
             e.vars?.INGEST_ENABLED!=='false' ||
             e.vars?.EMAIL_NOTIFICATIONS_ENABLED!=='false' ||
             e.vars?.EMAIL_TO!=='ipcdjofficial@gmail.com' ||
             e.vars?.EMAIL_FROM!=='' ||
             !Array.isArray(e.send_email) || e.send_email.length!==1 ||
             e.send_email[0]?.name!=='EMAIL' ||
             e.send_email[0]?.destination_address!=='ipcdjofficial@gmail.com' ||
             e.send_email[0]?.allowed_destination_addresses!==undefined ||
             e.send_email[0]?.allowed_sender_addresses!==undefined ||
             binding?.binding!=='DB' || binding?.database_name!=='ipcdj-song-requests-staging')
            throw new Error('Isolation config mismatch: refusing all deployment');
          if(binding.database_id!=='00000000-0000-0000-0000-000000000000' &&
             binding.database_id!==id)throw new Error('D1 binding differs from approved Staging database');
          config.env.staging.d1_databases[0].database_id=id;
          writeFileSync('wrangler.jsonc',JSON.stringify(config,null,2));
          console.log('Guard PASS: staging-only, approved parent SHA, safe D1, intake disabled');
          NODE
      - name: Install Wrangler on ephemeral GitHub-hosted runner
        run: npm install --no-audit --no-fund
      - name: Verify backend syntax and SQLite integration
        run: |
          node --check src/index.js
          node --check src/email-outbox.js
          node --test --experimental-sqlite test/requests.test.mjs
      - name: Apply non-destructive SQL schema to isolated Staging D1
        run: npx wrangler d1 execute DB --env staging --remote --file=./schema.sql --yes
      - name: Deploy Staging requests Worker (propagate Wrangler failures)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging 2>&1 | tee deploy-output.log
      - name: Verify real remote Worker health, intake OFF
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://ipcdj-song-requests-staging.ipcdjofficial.workers.dev';
          // Target is a previously verified staging-only workers.dev address.
          // Never infer target URLs from untrusted or failed deployment output.
          const res=await fetch(endpoint+'/health',{
            headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)
          });
          if(!res.ok)throw new Error('Remote health returned '+res.status);
          const h=await res.json();
          if(h.ok!==true||h.service!=='ipcdj-song-requests'||h.environment!=='staging'||
             h.intakeEnabled!==false||h.notificationsEnabled!==false||
             h.publicationEnabled!==false||h.storageConfigured!==true)
            throw new Error('Remote Staging Worker safety state invalid');
          console.log('REMOTE HEALTH PASS: '+endpoint+' — intake/email/publication disabled');
          NODE
      - name: Record deployment revision
        run: |
          echo "Isolated Staging request Worker: code ${{ github.sha }}"
          echo "No production release. No user submissions, outbound email or automatic publishing enabled."
