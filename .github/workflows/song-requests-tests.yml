name: IPCDJ Song Requests Backend Tests
on:
  push:
    branches: [staging]
    paths:
      - "requests/**"
      - ".github/workflows/song-requests-tests.yml"
      - ".github/workflows/song-requests-staging-cloud-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-api:
    name: request-api
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate isolated Worker syntax
        run: node --check requests/worker/src/index.js
      - name: Validate safe Cloudflare D1 provisioning helper syntax
        run: node --check requests/worker/scripts/provision-staging.mjs
      - name: Test Worker with real in-memory SQLite and atomic D1-compatible batches
        run: node --test --experimental-sqlite requests/worker/test/requests.test.mjs
      - name: Validate explicit isolated Staging deployment marker contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=fs.readFileSync('.github/workflows/song-requests-staging-cloud-deploy.yml','utf8');
          const control=JSON.parse(fs.readFileSync('requests/worker/deploy-control.json','utf8'));
          if(!p.includes('push:') || !p.includes('branches: [staging]') ||
             !p.includes('requests/worker/deploy-control.json'))
            throw new Error('Deployment must trigger only from Staging control-file changes');
          if(!p.includes("startsWith(github.event.head_commit.message") ||
             !p.includes("Deploy IPCDJ requests Staging: "))
            throw new Error('Explicit deploy commit intent marker missing');
          if(!p.includes('files.length!==1') || !p.includes('approvedTestedSha!==parent'))
            throw new Error('Only single-file approved previous-SHA deploy permitted');
          if(!p.includes("INGEST_ENABLED!=='false'"))
            throw new Error('Staging intake must remain disabled');
          if(!p.includes('ipcdj-requests-staging') ||
             !p.includes('REQUESTS_STAGING_D1_ID'))
            throw new Error('Missing isolated protected deployment environment');
          if(!p.includes('REMOTE HEALTH PASS'))
            throw new Error('Remote deployed health validation missing');
          if(control.enabled!==false || control.environment!=='staging' ||
             control.approvedTestedSha!=='')
            throw new Error('Initial deployment marker must remain disabled');
          NODE
      - name: Verify no production routing / no active intake by default
        shell: bash
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('requests/worker/wrangler.jsonc','utf8'));
          if(config.workers_dev!==false)throw new Error('Unexpected root public Worker');
          if(Object.keys(config.env||{}).join(',')!=='staging')throw new Error('Unexpected production Worker env');
          if(config.env.staging.vars.INGEST_ENABLED!=='false')throw new Error('Intake enabled without rollout');
          if(config.env.staging.vars.SITE_ORIGIN!=='https://staging.worship.ipcdj.org')throw new Error('Not isolated Staging origin');
          if(config.env.staging.d1_databases[0].database_name!=='ipcdj-song-requests-staging')throw new Error('DB isolation changed');
          "
