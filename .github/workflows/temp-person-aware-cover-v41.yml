name: One-time person-aware cover v41

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-person-aware-cover-v41.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add person-aware album-art reveal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('content="perimeter-cover-v40"','content="person-aware-cover-v41"',1)

          # Add subject-specific variables without altering the centered base artwork system.
          anchor='''      --cover-pos-x:50%;\n      --cover-pos-y:50%;'''
          repl='''      --cover-pos-x:50%;\n      --cover-pos-y:50%;\n      --subject-mask-x:88%;\n      --subject-mask-y:24%;\n      --subject-shift-x:0%;\n      --subject-shift-y:0%;\n      --subject-opacity:0;'''
          if anchor not in s: raise SystemExit('cover position variables not found')
          s=s.replace(anchor,repl,1)

          # Insert a separate subject-detail layer. The base cover and perimeter layers remain unchanged.
          anchor='''    .current .cover-edge-detail::after{\n      content:"";\n      position:absolute;\n      inset:0;\n      background:\n        linear-gradient(180deg, rgba(4,7,12,.08) 0%, rgba(4,7,12,0) 18%, rgba(4,7,12,0) 82%, rgba(4,7,12,.10) 100%),\n        linear-gradient(90deg, rgba(4,7,12,.07) 0%, rgba(4,7,12,0) 13%, rgba(4,7,12,0) 87%, rgba(4,7,12,.07) 100%);\n    }'''
          repl='''    .current .cover-edge-detail::after{\n      content:"";\n      position:absolute;\n      inset:0;\n      background:\n        linear-gradient(180deg, rgba(4,7,12,.08) 0%, rgba(4,7,12,0) 18%, rgba(4,7,12,0) 82%, rgba(4,7,12,.10) 100%),\n        linear-gradient(90deg, rgba(4,7,12,.07) 0%, rgba(4,7,12,0) 13%, rgba(4,7,12,0) 87%, rgba(4,7,12,.07) 100%);\n    }\n\n    .current .cover-subject-detail{\n      position:absolute;\n      inset:-6%;\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:cover;\n      background-position:var(--cover-pos-x) var(--cover-pos-y);\n      background-repeat:no-repeat;\n      filter:blur(.9px) saturate(1.10) contrast(1.05);\n      -webkit-filter:blur(.9px) saturate(1.10) contrast(1.05);\n      opacity:var(--subject-opacity);\n      transform:translate3d(var(--subject-shift-x),var(--subject-shift-y),0) scale(1.045);\n      transform-origin:center;\n      -webkit-mask-image:radial-gradient(ellipse 20% 26% at var(--subject-mask-x) var(--subject-mask-y), #000 0%, rgba(0,0,0,.95) 28%, rgba(0,0,0,.72) 52%, rgba(0,0,0,.30) 72%, transparent 100%);\n      mask-image:radial-gradient(ellipse 20% 26% at var(--subject-mask-x) var(--subject-mask-y), #000 0%, rgba(0,0,0,.95) 28%, rgba(0,0,0,.72) 52%, rgba(0,0,0,.30) 72%, transparent 100%);\n      transition:opacity .8s ease,transform .8s ease;\n      will-change:opacity,transform;\n    }'''
          if anchor not in s: raise SystemExit('edge detail block not found')
          s=s.replace(anchor,repl,1)

          # Mobile keeps the same centered cover while subject emphasis is softened.
          anchor='''    @media (max-width:640px){\n      .current .cover-edge-detail{'''
          repl='''    @media (max-width:640px){\n      .current .cover-subject-detail{\n        filter:blur(1.25px) saturate(1.08) contrast(1.04);\n        -webkit-filter:blur(1.25px) saturate(1.08) contrast(1.04);\n      }\n\n      .current .cover-edge-detail{'''
          if anchor not in s: raise SystemExit('mobile cover block not found')
          s=s.replace(anchor,repl,1)

          anchor='''      .current .cover-detail{opacity:.14}\n      .current .cover-edge-detail{opacity:.18}'''
          repl='''      .current .cover-detail{opacity:.14}\n      .current .cover-edge-detail{opacity:.18}\n      .current .cover-subject-detail{--subject-opacity:.12}'''
          if anchor not in s: raise SystemExit('reduced transparency cover block not found')
          s=s.replace(anchor,repl,1)

          # Add the subject layer beside the existing artwork layers.
          anchor='''      <div class="cover-detail" aria-hidden="true"></div>\n      <div class="cover-edge-detail" aria-hidden="true"></div>'''
          repl='''      <div class="cover-detail" aria-hidden="true"></div>\n      <div class="cover-edge-detail" aria-hidden="true"></div>\n      <div class="cover-subject-detail" aria-hidden="true"></div>'''
          if anchor not in s: raise SystemExit('artwork layer markup not found')
          s=s.replace(anchor,repl,1)

          # Add subject focus cache alongside the existing cover palette cache.
          anchor='''    const COVER_THEME_CACHE_PREFIX="ipcdj-cover-theme-v1:";'''
          repl='''    const COVER_THEME_CACHE_PREFIX="ipcdj-cover-theme-v1:";\n    const COVER_SUBJECT_CACHE_PREFIX="ipcdj-cover-subject-v1:";'''
          if anchor not in s: raise SystemExit('cover theme cache prefix not found')
          s=s.replace(anchor,repl,1)

          # Reset the person layer whenever artwork changes so stale subject placement never leaks between songs.
          anchor='''    function applyCoverArtwork(song,url){\n      const card=$("current-song-card");\n      if(!card||!url)return;\n      const safe=highResolutionArtworkUrl(url).replace(/[\\\"'\\\\()]/g, m=>"\\\\"+m);\n      card.style.setProperty("--cover-image",'url("'+safe+'")');\n      card.dataset.coverArtwork=song.id;\n    }'''
          repl='''    function resetCoverSubject(card){\n      if(!card)return;\n      card.style.setProperty("--subject-opacity","0");\n      card.style.setProperty("--subject-shift-x","0%");\n      card.style.setProperty("--subject-shift-y","0%");\n      card.style.setProperty("--subject-mask-x","88%");\n      card.style.setProperty("--subject-mask-y","24%");\n      delete card.dataset.coverSubject;\n    }\n\n    function applyCoverArtwork(song,url){\n      const card=$("current-song-card");\n      if(!card||!url)return;\n      const safe=highResolutionArtworkUrl(url).replace(/[\\\"'\\\\()]/g, m=>"\\\\"+m);\n      resetCoverSubject(card);\n      card.style.setProperty("--cover-image",'url("'+safe+'")');\n      card.dataset.coverArtwork=song.id;\n    }'''
          if anchor not in s: raise SystemExit('applyCoverArtwork function not found')
          s=s.replace(anchor,repl,1)

          # Insert native, privacy-preserving face detection with manual metadata fallback.
          anchor='''    function loadPaletteFromArtwork(url){'''
          insert='''    function normalizeSubjectFocus(value){\n      if(!value||!Number.isFinite(value.x)||!Number.isFinite(value.y))return null;\n      return {\n        x:clamp01(value.x),\n        y:clamp01(value.y),\n        confidence:Number.isFinite(value.confidence)?clamp01(value.confidence):1,\n        source:value.source||"manual"\n      };\n    }\n\n    function applyCoverSubject(song,focus){\n      const card=$("current-song-card");\n      const normalized=normalizeSubjectFocus(focus);\n      if(!card||!normalized)return false;\n\n      // Keep the official cover itself centered. Only the extra detail layer is biased.\n      const nearestRight=normalized.x>=.5;\n      const targetX=nearestRight?.90:.10;\n      const targetY=Math.min(.82,Math.max(.18,normalized.y));\n      const rawShift=(targetX-normalized.x)*100;\n      const shiftX=Math.max(-12,Math.min(12,rawShift));\n      const shiftedX=Math.min(.93,Math.max(.07,normalized.x+(shiftX/100)));\n      const shiftY=Math.max(-4,Math.min(4,(targetY-normalized.y)*100));\n      const shiftedY=Math.min(.88,Math.max(.12,normalized.y+(shiftY/100)));\n      const strength=.32+(.18*normalized.confidence);\n\n      card.style.setProperty("--subject-shift-x",shiftX.toFixed(2)+"%");\n      card.style.setProperty("--subject-shift-y",shiftY.toFixed(2)+"%");\n      card.style.setProperty("--subject-mask-x",(shiftedX*100).toFixed(1)+"%");\n      card.style.setProperty("--subject-mask-y",(shiftedY*100).toFixed(1)+"%");\n      card.style.setProperty("--subject-opacity",Math.min(.50,strength).toFixed(2));\n      card.dataset.coverSubject=song.id;\n      return true;\n    }\n\n    async function detectCoverSubject(song,url){\n      const manual=normalizeSubjectFocus(song.subjectFocus);\n      if(manual)return manual;\n\n      try{\n        const cached=localStorage.getItem(COVER_SUBJECT_CACHE_PREFIX+song.id);\n        if(cached){\n          const parsed=JSON.parse(cached);\n          if(parsed===null)return null;\n          const normalized=normalizeSubjectFocus(parsed);\n          if(normalized)return normalized;\n        }\n      }catch(_){}\n\n      // Native FaceDetector is deliberately progressive enhancement: no third-party\n      // biometric service, no upload, and no effect on the base artwork when unsupported.\n      if(typeof window.FaceDetector!=="function")return null;\n\n      let bitmap=null;\n      try{\n        const response=await fetch(url,{cache:"force-cache",mode:"cors"});\n        if(!response.ok)throw new Error("Artwork unavailable for subject detection");\n        const blob=await response.blob();\n        bitmap=await createImageBitmap(blob);\n        const detector=new FaceDetector({fastMode:true,maxDetectedFaces:6});\n        const faces=await detector.detect(bitmap);\n        if(!faces||!faces.length){\n          try{localStorage.setItem(COVER_SUBJECT_CACHE_PREFIX+song.id,"null")}catch(_){}\n          return null;\n        }\n\n        const ranked=faces\n          .map(face=>{\n            const box=face.boundingBox;\n            const area=Math.max(1,box.width*box.height);\n            return {face,box,area};\n          })\n          .sort((a,b)=>b.area-a.area);\n        const best=ranked[0];\n        const focus={\n          x:(best.box.x+(best.box.width/2))/bitmap.width,\n          y:(best.box.y+(best.box.height/2))/bitmap.height,\n          confidence:Math.min(1,Math.max(.55,best.area/(bitmap.width*bitmap.height)*14)),\n          source:"native-face-detector"\n        };\n        const normalized=normalizeSubjectFocus(focus);\n        try{localStorage.setItem(COVER_SUBJECT_CACHE_PREFIX+song.id,JSON.stringify(normalized))}catch(_){}\n        return normalized;\n      }catch(_){\n        return null;\n      }finally{\n        try{if(bitmap&&bitmap.close)bitmap.close()}catch(_){}\n      }\n    }\n\n    async function ensureCoverSubject(song,url,token){\n      const focus=await detectCoverSubject(song,url);\n      if(token!==coverThemeRequestToken||!focus)return;\n      applyCoverSubject(song,focus);\n    }\n\n    function loadPaletteFromArtwork(url){'''
          if anchor not in s: raise SystemExit('loadPaletteFromArtwork anchor not found')
          s=s.replace(anchor,insert,1)

          # Trigger subject enhancement after the official artwork is applied, without blocking palette/countdown logic.
          anchor='''        applyCoverArtwork(song,artworkUrl);\n\n        if(cachedPalette)return;'''
          repl='''        applyCoverArtwork(song,artworkUrl);\n        ensureCoverSubject(song,artworkUrl,token);\n\n        if(cachedPalette)return;'''
          if anchor not in s: raise SystemExit('cover artwork application anchor not found')
          s=s.replace(anchor,repl,1)

          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text().replace('const CACHE_NAME = "ipcdj-worship-v40";','const CACHE_NAME = "ipcdj-worship-v41";',1)
          sw.write_text(t)

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          block='''\n\n## Person-aware album-art emphasis\n\nThe active-song card keeps the established centered official-cover treatment as its permanent base. When a human face can be detected in the artwork, the system may add a separate detail-only emphasis layer that gently biases that person toward the nearest low-conflict outer edge.\n\nRequired behavior:\n- Never replace, crop-shift, or disturb the centered 50% / 50% base artwork layers.\n- Person emphasis is an additional progressive-enhancement layer only.\n- Detection runs locally in the browser through the native FaceDetector API when available; artwork is not uploaded to a third-party recognition service.\n- If detection is unavailable, fails, or finds no face, the established v40 centered/perimeter artwork treatment remains exactly intact.\n- The largest detected face is treated as the primary visual subject; the extra detail layer may shift by a tightly capped amount toward the nearest outer edge.\n- The detail mask follows the shifted subject and stays feathered, lightly blurred, and subordinate to text.\n- Subject opacity is capped so the enhancement remains noticeable but non-distracting.\n- Detection results may be cached locally per song to avoid repeated work.\n- A future song may optionally define subjectFocus:{x,y,confidence} as a manual override if native detection is unavailable or a cover needs art-direction correction.\n- Semantic stage colors, countdown/progress logic, the centered base cover, perimeter reveal, and page-wide animated ambient background remain independent and unchanged.\n'''
          if '## Person-aware album-art emphasis' not in u:
              u += block
          st.write_text(u)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Add person-aware edge emphasis for active-song artwork"
          git push origin main
