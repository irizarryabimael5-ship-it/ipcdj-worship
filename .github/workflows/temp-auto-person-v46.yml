name: One-time auto person v46

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-auto-person-v46.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Implement automatic person-aware cover treatment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('content="isolated-person-v45"','content="auto-person-v46"',1)

          old_css='''    .current .cover-subject-detail{\n      position:absolute;\n      top:0;\n      right:0;\n      width:var(--subject-width);\n      height:var(--subject-height);\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:var(--subject-bg-size) auto;\n      background-position:var(--subject-bg-x) var(--subject-bg-y);\n      background-repeat:no-repeat;\n      filter:blur(.10px) saturate(1.16) contrast(1.08);\n      -webkit-filter:blur(.10px) saturate(1.16) contrast(1.08);\n      opacity:var(--subject-opacity);\n      transform:none;\n      transform-origin:top right;\n      overflow:hidden;\n      border-top-right-radius:28px;\n      clip-path:inset(0 0 0 0 round 0 28px 0 0);\n      -webkit-clip-path:inset(0 0 0 0 round 0 28px 0 0);\n      -webkit-mask-image:\n        radial-gradient(ellipse 34% 18% at 78% 18%, #000 0%, #000 54%, rgba(0,0,0,.82) 70%, rgba(0,0,0,.22) 88%, transparent 100%),\n        radial-gradient(ellipse 30% 34% at 76% 58%, #000 0%, #000 52%, rgba(0,0,0,.84) 70%, rgba(0,0,0,.24) 88%, transparent 100%),\n        linear-gradient(270deg, #000 0%, rgba(0,0,0,.96) 18%, rgba(0,0,0,.52) 34%, transparent 52%),\n        linear-gradient(180deg, #000 0%, rgba(0,0,0,.92) 18%, rgba(0,0,0,.48) 36%, transparent 56%);\n      mask-image:\n        radial-gradient(ellipse 34% 18% at 78% 18%, #000 0%, #000 54%, rgba(0,0,0,.82) 70%, rgba(0,0,0,.22) 88%, transparent 100%),\n        radial-gradient(ellipse 30% 34% at 76% 58%, #000 0%, #000 52%, rgba(0,0,0,.84) 70%, rgba(0,0,0,.24) 88%, transparent 100%),\n        linear-gradient(270deg, #000 0%, rgba(0,0,0,.96) 18%, rgba(0,0,0,.52) 34%, transparent 52%),\n        linear-gradient(180deg, #000 0%, rgba(0,0,0,.92) 18%, rgba(0,0,0,.48) 36%, transparent 56%);\n      -webkit-mask-composite:source-over;\n      mask-composite:add;\n      transition:opacity .8s ease;\n      will-change:opacity;\n    }'''
          new_css='''    .current .cover-subject-detail{\n      position:absolute;\n      top:-3%;\n      right:-2%;\n      width:calc(var(--subject-width) + 8%);\n      height:calc(var(--subject-height) + 8%);\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:var(--subject-bg-size) auto;\n      background-position:var(--subject-bg-x) var(--subject-bg-y);\n      background-repeat:no-repeat;\n      filter:blur(.18px) saturate(1.14) contrast(1.06);\n      -webkit-filter:blur(.18px) saturate(1.14) contrast(1.06);\n      opacity:var(--subject-opacity);\n      transform:translateZ(0);\n      transform-origin:top right;\n      -webkit-mask-image:\n        radial-gradient(ellipse 43% 30% at 74% 27%, #000 0%, #000 38%, rgba(0,0,0,.92) 54%, rgba(0,0,0,.62) 69%, rgba(0,0,0,.28) 82%, transparent 96%),\n        radial-gradient(ellipse 38% 49% at 74% 60%, #000 0%, #000 34%, rgba(0,0,0,.90) 50%, rgba(0,0,0,.58) 66%, rgba(0,0,0,.24) 80%, transparent 96%);\n      mask-image:\n        radial-gradient(ellipse 43% 30% at 74% 27%, #000 0%, #000 38%, rgba(0,0,0,.92) 54%, rgba(0,0,0,.62) 69%, rgba(0,0,0,.28) 82%, transparent 96%),\n        radial-gradient(ellipse 38% 49% at 74% 60%, #000 0%, #000 34%, rgba(0,0,0,.90) 50%, rgba(0,0,0,.58) 66%, rgba(0,0,0,.24) 80%, transparent 96%);\n      -webkit-mask-composite:source-over;\n      mask-composite:add;\n      transition:opacity .8s ease;\n      will-change:opacity;\n    }'''
          if old_css not in s: raise SystemExit('v45 subject CSS not found')
          s=s.replace(old_css,new_css,1)

          old_mobile='''      .current .cover-subject-detail{\n        width:38%;\n        height:31%;\n        background-size:380% auto;\n        background-position:89% 64%;\n        filter:blur(.18px) saturate(1.14) contrast(1.06);\n        -webkit-filter:blur(.18px) saturate(1.14) contrast(1.06);\n        -webkit-mask-image:\n          radial-gradient(ellipse 36% 19% at 79% 18%, #000 0%, #000 54%, rgba(0,0,0,.82) 70%, rgba(0,0,0,.22) 88%, transparent 100%),\n          radial-gradient(ellipse 31% 36% at 77% 59%, #000 0%, #000 52%, rgba(0,0,0,.84) 70%, rgba(0,0,0,.24) 88%, transparent 100%),\n          linear-gradient(270deg, #000 0%, rgba(0,0,0,.95) 18%, rgba(0,0,0,.48) 34%, transparent 54%),\n          linear-gradient(180deg, #000 0%, rgba(0,0,0,.90) 18%, rgba(0,0,0,.42) 36%, transparent 58%);\n        mask-image:\n          radial-gradient(ellipse 36% 19% at 79% 18%, #000 0%, #000 54%, rgba(0,0,0,.82) 70%, rgba(0,0,0,.22) 88%, transparent 100%),\n          radial-gradient(ellipse 31% 36% at 77% 59%, #000 0%, #000 52%, rgba(0,0,0,.84) 70%, rgba(0,0,0,.24) 88%, transparent 100%),\n          linear-gradient(270deg, #000 0%, rgba(0,0,0,.95) 18%, rgba(0,0,0,.48) 34%, transparent 54%),\n          linear-gradient(180deg, #000 0%, rgba(0,0,0,.90) 18%, rgba(0,0,0,.42) 36%, transparent 58%);\n      }'''
          new_mobile='''      .current .cover-subject-detail{\n        top:-4%;\n        right:-4%;\n        width:calc(var(--subject-width) + 16%);\n        height:calc(var(--subject-height) + 11%);\n        background-size:var(--subject-bg-size) auto;\n        background-position:var(--subject-bg-x) var(--subject-bg-y);\n        filter:blur(.28px) saturate(1.12) contrast(1.05);\n        -webkit-filter:blur(.28px) saturate(1.12) contrast(1.05);\n        -webkit-mask-image:\n          radial-gradient(ellipse 45% 31% at 74% 27%, #000 0%, #000 34%, rgba(0,0,0,.88) 51%, rgba(0,0,0,.54) 67%, rgba(0,0,0,.22) 82%, transparent 97%),\n          radial-gradient(ellipse 40% 52% at 74% 61%, #000 0%, #000 30%, rgba(0,0,0,.86) 47%, rgba(0,0,0,.50) 64%, rgba(0,0,0,.20) 80%, transparent 97%);\n        mask-image:\n          radial-gradient(ellipse 45% 31% at 74% 27%, #000 0%, #000 34%, rgba(0,0,0,.88) 51%, rgba(0,0,0,.54) 67%, rgba(0,0,0,.22) 82%, transparent 97%),\n          radial-gradient(ellipse 40% 52% at 74% 61%, #000 0%, #000 30%, rgba(0,0,0,.86) 47%, rgba(0,0,0,.50) 64%, rgba(0,0,0,.20) 80%, transparent 97%);\n      }'''
          if old_mobile not in s: raise SystemExit('v45 mobile subject CSS not found')
          s=s.replace(old_mobile,new_mobile,1)

          old_fn='''    function applyCurrentSongSubjectArt(song){\n      const card=$("current-song-card");\n      if(!card)return;\n      resetCoverSubject(card);\n\n      // Current approval trial for Dios De Milagros: preserve the centered full-cover\n      // atmosphere/reveals, then add only a tightly cropped right-side singer in the empty\n      // top-right corner. This is intentionally not generalized until visually approved.\n      if(song.id!=="dios-de-milagros")return;\n      card.style.setProperty("--subject-width","31%");\n      card.style.setProperty("--subject-height","37%");\n      card.style.setProperty("--subject-bg-x","88%");\n      card.style.setProperty("--subject-bg-y","64%");\n      card.style.setProperty("--subject-bg-size","325%");\n      card.style.setProperty("--subject-opacity",".95");\n      card.dataset.coverSubject="trial-dios-de-milagros-top-right-isolated-person-v45";\n    }'''
          new_fn='''    const COVER_SUBJECT_CACHE_PREFIX="ipcdj-cover-subject-v1:";\n    const coverSubjectFocusCache=new Map();\n\n    function clampCoverSubject(value,min,max){\n      return Math.max(min,Math.min(max,value));\n    }\n\n    function loadCoverImageForSubjectDetection(url){\n      return new Promise((resolve,reject)=>{\n        const image=new Image();\n        image.crossOrigin="anonymous";\n        image.decoding="async";\n        image.onload=()=>resolve(image);\n        image.onerror=reject;\n        image.src=url;\n      });\n    }\n\n    function applyResolvedCoverSubject(card,focus,label){\n      if(!card||!focus)return false;\n      card.style.setProperty("--subject-width",focus.width||"31%");\n      card.style.setProperty("--subject-height",focus.height||"37%");\n      card.style.setProperty("--subject-bg-x",focus.bgX||"88%");\n      card.style.setProperty("--subject-bg-y",focus.bgY||"64%");\n      card.style.setProperty("--subject-bg-size",focus.bgSize||"325%");\n      card.style.setProperty("--subject-opacity",focus.opacity||".93");\n      card.dataset.coverSubject=label||focus.source||"cover-person";\n      return true;\n    }\n\n    function manualCoverSubjectFocus(song){\n      if(song.id==="dios-de-milagros"){\n        return {width:"31%",height:"37%",bgX:"88%",bgY:"64%",bgSize:"325%",opacity:".95",source:"approved-dios-de-milagros"};\n      }\n      return song.coverSubjectFocus||song.subjectFocus||null;\n    }\n\n    function detectedFaceToCoverFocus(face,image){\n      const box=face&&face.boundingBox;\n      if(!box||!image.naturalWidth||!image.naturalHeight)return null;\n      const cx=((box.x+(box.width/2))/image.naturalWidth)*100;\n      const cy=((box.y+(box.height*.58))/image.naturalHeight)*100;\n      const faceRatio=Math.max(box.width/image.naturalWidth,box.height/image.naturalHeight);\n      const bgSize=Math.round(clampCoverSubject(390-(faceRatio*420),285,380));\n      return {\n        width:"32%",\n        height:"39%",\n        bgX:`${Math.round(clampCoverSubject(cx,8,94)*10)/10}%`,\n        bgY:`${Math.round(clampCoverSubject(cy,12,88)*10)/10}%`,\n        bgSize:`${bgSize}%`,\n        opacity:".93",\n        source:"native-face-detection"\n      };\n    }\n\n    async function detectCoverSubjectFocus(song,artworkUrl){\n      if(!artworkUrl||typeof window.FaceDetector!=="function"||!window.isSecureContext)return null;\n      const key=song.id+"|"+artworkUrl;\n      if(coverSubjectFocusCache.has(key))return coverSubjectFocusCache.get(key);\n      try{\n        const stored=localStorage.getItem(COVER_SUBJECT_CACHE_PREFIX+song.id);\n        if(stored){\n          const parsed=JSON.parse(stored);\n          if(parsed&&parsed.artworkUrl===artworkUrl&&parsed.focus){\n            coverSubjectFocusCache.set(key,parsed.focus);\n            return parsed.focus;\n          }\n        }\n      }catch(_){}\n\n      let focus=null;\n      try{\n        const image=await loadCoverImageForSubjectDetection(artworkUrl);\n        const detector=new FaceDetector({fastMode:true,maxDetectedFaces:6});\n        const faces=await detector.detect(image);\n        if(Array.isArray(faces)&&faces.length){\n          const best=faces.slice().sort((a,b)=>{\n            const aa=(a.boundingBox?.width||0)*(a.boundingBox?.height||0);\n            const ba=(b.boundingBox?.width||0)*(b.boundingBox?.height||0);\n            return ba-aa;\n          })[0];\n          focus=detectedFaceToCoverFocus(best,image);\n        }\n      }catch(_){}\n\n      coverSubjectFocusCache.set(key,focus);\n      try{localStorage.setItem(COVER_SUBJECT_CACHE_PREFIX+song.id,JSON.stringify({artworkUrl,focus}))}catch(_){}\n      return focus;\n    }\n\n    function applyCurrentSongSubjectArt(song,artworkUrl){\n      const card=$("current-song-card");\n      if(!card)return;\n      resetCoverSubject(card);\n      const songKey=song.id;\n      card.dataset.coverSongId=songKey;\n\n      const manual=manualCoverSubjectFocus(song);\n      if(manual){\n        applyResolvedCoverSubject(card,manual,manual.source||"manual-cover-person");\n        return;\n      }\n\n      detectCoverSubjectFocus(song,artworkUrl).then(focus=>{\n        if(!focus)return;\n        if(card.dataset.coverSongId!==songKey)return;\n        applyResolvedCoverSubject(card,focus,focus.source||"auto-cover-person");\n      }).catch(()=>{});\n    }'''
          if old_fn not in s: raise SystemExit('v45 subject function not found')
          s=s.replace(old_fn,new_fn,1)
          s=s.replace('applyCurrentSongSubjectArt(song);','applyCurrentSongSubjectArt(song,artworkUrl);',1)
          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text().replace('const CACHE_NAME = "ipcdj-worship-v45";','const CACHE_NAME = "ipcdj-worship-v46";',1)
          sw.write_text(t)

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          block='''\n\n## Automatic person-aware album-cover treatment v46\n\nThe base treatment is permanent for every current song, whether people are present or not: use the official album cover centered at 50% / 50%, preserve the heavily blurred full-card atmosphere, and noticeably reveal the centered cover through low-content areas and the perimeter without compromising text readability.\n\nWhen a cover contains a detectable person, add the approved top-right person treatment on top of that base. The person layer must be isolated from the same cover, near-crisp, strongly visible, and smoothly feathered into the existing cover atmosphere with no rectangular crop line, hard seam, or visible layer boundary on desktop, mobile, tablet, PWA, or other supported layouts. Native FaceDetector detection is used only when available in a secure context; detection failure or unsupported browsers must simply fall back to the universal centered-cover base without changing layout or functionality. Detection results may be cached locally. Manual coverSubjectFocus / subjectFocus overrides remain supported for art-direction correction, and the approved Dios De Milagros framing remains the reference implementation.\n'''
          if '## Automatic person-aware album-cover treatment v46' not in u:u+=block
          st.write_text(u)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Add automatic person-aware album cover treatment"
          git push origin main
