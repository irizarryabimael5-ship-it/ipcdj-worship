name: IPCDJ Website Health

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ipcdj-website-health
  cancel-in-progress: true

jobs:
  cross-platform-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: monitoring

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install health test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-platform website health matrix
        env:
          IPCDJ_BASE_URL: https://worship.ipcdj.org
        run: npx playwright test

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipcdj-health-diagnostics-${{ github.run_id }}
          path: |
            monitoring/playwright-report
            monitoring/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Open or update health alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'IPCDJ Website Health Alert';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Automated cross-platform health checks detected a regression.',
              '',
              `Run: ${runUrl}`,
              `Commit: ${context.sha}`,
              '',
              'The failing run includes Playwright traces, screenshots, videos, and health snapshots when available.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(issue => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close recovered health alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'IPCDJ Website Health Alert';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (!existing) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Recovered: the full cross-platform health matrix is passing again.\n\nRun: ${runUrl}`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed'
            });
