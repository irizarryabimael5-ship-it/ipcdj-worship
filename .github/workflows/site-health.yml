name: IPCDJ Website Health

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ipcdj-website-health
  cancel-in-progress: true

jobs:
  cross-platform-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: monitoring

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate watchdog co-development contract
        shell: bash
        run: |
          set -euo pipefail
          test -f WATCHDOG_POLICY.md
          grep -q "Every substantive runtime feature" WATCHDOG_POLICY.md
          grep -q "Mandatory user-facing completion report" WATCHDOG_POLICY.md
          grep -q "Watchdog co-development contract v142" ../SITE_STANDARDS.md

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate notification platform contracts
        shell: bash
        run: |
          node --test ../notifications/tests/planner.test.mjs
          node --check ../notifications/client.js
          node --check ../notifications/ui.js
          node --check ../notifications/sw-foundation.js
          node --check ../notifications/worker/src/index.js
          node --check ../notifications/scripts/export-catalog.mjs
          node --check ../notifications/scripts/sync-catalog.mjs
          node ../notifications/scripts/export-catalog.mjs > /tmp/ipcdj-notification-catalog.json
          node -e "const x=require('/tmp/ipcdj-notification-catalog.json'); if(!Array.isArray(x.songs)||!x.songs.length) process.exit(1)"

      - name: Install health test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start Linux audio backend for Firefox Web Audio
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1 || true

      - name: Wait for the current repository build to be live
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BUILD="$(grep -o 'meta name="ipcdj-build" content="[^"]*"' ../index.html | sed -E 's/.*content="([^"]*)".*/\1/' | head -n1)"
          if [ -z "$EXPECTED_BUILD" ]; then
            echo "Could not determine expected IPCDJ build from index.html"
            exit 1
          fi

          echo "Waiting for deployed build: $EXPECTED_BUILD"
          for attempt in $(seq 1 36); do
            LIVE_BUILD="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://worship.ipcdj.org/?deploy-health=${GITHUB_RUN_ID}-${attempt}" | grep -o 'meta name="ipcdj-build" content="[^"]*"' | sed -E 's/.*content="([^"]*)".*/\1/' | head -n1 || true)"
            if [ "$LIVE_BUILD" = "$EXPECTED_BUILD" ]; then
              echo "Deployment confirmed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: live='$LIVE_BUILD' expected='$EXPECTED_BUILD'; retrying in 10s."
            sleep 10
          done

          echo "Timed out waiting for GitHub Pages to deploy $EXPECTED_BUILD"
          exit 1

      - name: Run cross-platform website health matrix
        env:
          IPCDJ_BASE_URL: https://worship.ipcdj.org
        run: npx playwright test

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipcdj-health-diagnostics-${{ github.run_id }}
          path: |
            monitoring/playwright-report
            monitoring/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Open or update health alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'IPCDJ Website Health Alert';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Automated cross-platform health checks detected a regression.',
              '',
              `Run: ${runUrl}`,
              `Commit: ${context.sha}`,
              `Trigger: ${context.eventName}`,
              '',
              'The failing run includes Playwright traces, screenshots, console diagnostics, and IPCDJ health snapshots when available.',
              'The monitor uses conservative CI thresholds and a separate real-device adaptive performance guard to reduce false positives.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(issue => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close recovered health alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'IPCDJ Website Health Alert';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (!existing) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Recovered: the full cross-platform health matrix is passing again.\n\nRun: ${runUrl}`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed'
            });
