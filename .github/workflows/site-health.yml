name: IPCDJ Website Health

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ipcdj-website-health
  cancel-in-progress: true

jobs:
  cross-platform-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: monitoring

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate watchdog co-development contract
        shell: bash
        run: |
          set -euo pipefail
          test -f WATCHDOG_POLICY.md
          grep -q "Every substantive runtime feature" WATCHDOG_POLICY.md
          grep -q "Mandatory user-facing completion report" WATCHDOG_POLICY.md
          grep -q "Watchdog co-development contract v142" ../SITE_STANDARDS.md

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate notification platform contracts
        shell: bash
        run: |
          node --test ../notifications/tests/planner.test.mjs
          node --check ../notifications/client.js
          node --check ../notifications/ui.js
          node --check ../notifications/sw-foundation.js
          node --check ../notifications/worker/src/index.js
          node --check ../notifications/worker/scripts/generate-credentials.mjs
          node ../notifications/worker/scripts/generate-credentials.mjs > /tmp/ipcdj-push-credentials.json
          node -e "const x=require('/tmp/ipcdj-push-credentials.json'); if(!x.VAPID_PUBLIC_KEY||!x.VAPID_PRIVATE_KEY||!x.ADMIN_TOKEN) process.exit(1)"
          node --check ../notifications/scripts/export-catalog.mjs
          node --check ../notifications/scripts/sync-catalog.mjs
          node ../notifications/scripts/export-catalog.mjs > /tmp/ipcdj-notification-catalog.json
          node -e "const x=require('/tmp/ipcdj-notification-catalog.json'); if(!Array.isArray(x.songs)||!x.songs.length) process.exit(1)"
          node -e "const p=require('../notifications/worker/package.json'); if(!p.scripts['db:local'].includes('d1 execute DB')||!p.scripts['db:remote'].includes('d1 execute DB')) process.exit(1)"
          python3 - <<'PY'
          import sqlite3, pathlib
          schema=pathlib.Path('../notifications/worker/schema.sql').read_text()
          con=sqlite3.connect(':memory:')
          con.executescript(schema)
          expected={'subscriptions','songs','notification_events','deliveries'}
          tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing=expected-tables
          if missing:
              raise SystemExit(f"Missing D1 tables: {sorted(missing)}")
          PY

      - name: Install health test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start Linux audio backend for Firefox Web Audio
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1 || true

      - name: Wait for the exact repository runtime to be live
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BUILD="$(grep -o 'meta name="ipcdj-build" content="[^"]*"' ../index.html | sed -E 's/.*content="([^"]*)".*/\1/' | head -n1)"
          if [ -z "$EXPECTED_BUILD" ]; then
            echo "Could not determine expected IPCDJ build from index.html"
            exit 1
          fi

          EXPECTED_INDEX_SHA="$(sha256sum ../index.html | awk '{print $1}')"
          EXPECTED_SW_SHA="$(sha256sum ../sw.js | awk '{print $1}')"
          EXPECTED_SOCIAL_SHA="$(sha256sum ../social-preview-v176.jpg | awk '{print $1}')"

          echo "Waiting for exact deployed runtime: $EXPECTED_BUILD"
          echo "index=$EXPECTED_INDEX_SHA"
          echo "sw=$EXPECTED_SW_SHA"
          echo "social=$EXPECTED_SOCIAL_SHA"

          for attempt in $(seq 1 48); do
            nonce="${GITHUB_RUN_ID}-${attempt}"
            rm -f /tmp/ipcdj-live-index /tmp/ipcdj-live-sw /tmp/ipcdj-live-social

            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://worship.ipcdj.org/?deploy-health=${nonce}" \
              -o /tmp/ipcdj-live-index || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://worship.ipcdj.org/sw.js?deploy-health=${nonce}" \
              -o /tmp/ipcdj-live-sw || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://worship.ipcdj.org/social-preview-v176.jpg?deploy-health=${nonce}" \
              -o /tmp/ipcdj-live-social || true

            LIVE_BUILD="$(grep -o 'meta name="ipcdj-build" content="[^"]*"' /tmp/ipcdj-live-index 2>/dev/null | sed -E 's/.*content="([^"]*)".*/\1/' | head -n1 || true)"
            LIVE_INDEX_SHA="$(sha256sum /tmp/ipcdj-live-index 2>/dev/null | awk '{print $1}' || true)"
            LIVE_SW_SHA="$(sha256sum /tmp/ipcdj-live-sw 2>/dev/null | awk '{print $1}' || true)"
            LIVE_SOCIAL_SHA="$(sha256sum /tmp/ipcdj-live-social 2>/dev/null | awk '{print $1}' || true)"

            if [ "$LIVE_BUILD" = "$EXPECTED_BUILD" ] \
              && [ "$LIVE_INDEX_SHA" = "$EXPECTED_INDEX_SHA" ] \
              && [ "$LIVE_SW_SHA" = "$EXPECTED_SW_SHA" ] \
              && [ "$LIVE_SOCIAL_SHA" = "$EXPECTED_SOCIAL_SHA" ]; then
              echo "Exact deployment confirmed on attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt mismatch:"
            echo "  build:  live='$LIVE_BUILD' expected='$EXPECTED_BUILD'"
            echo "  index:  live='$LIVE_INDEX_SHA' expected='$EXPECTED_INDEX_SHA'"
            echo "  sw:     live='$LIVE_SW_SHA' expected='$EXPECTED_SW_SHA'"
            echo "  social: live='$LIVE_SOCIAL_SHA' expected='$EXPECTED_SOCIAL_SHA'"
            sleep 10
          done

          echo "Timed out waiting for the exact final runtime bytes to deploy."
          exit 1

      - name: Run cross-platform website health matrix
        env:
          IPCDJ_BASE_URL: https://worship.ipcdj.org
        run: npx playwright test

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipcdj-health-diagnostics-${{ github.run_id }}
          path: |
            monitoring/playwright-report
            monitoring/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Open or update health alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'IPCDJ Website Health Alert';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Automated cross-platform health checks detected a regression.',
              '',
              `Run: ${runUrl}`,
              `Commit: ${context.sha}`,
              `Trigger: ${context.eventName}`,
              '',
              'The failing run includes Playwright traces, screenshots, console diagnostics, and IPCDJ health snapshots when available.',
              'The monitor uses conservative CI thresholds and a separate real-device adaptive performance guard to reduce false positives.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(issue => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close recovered health alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'IPCDJ Website Health Alert';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (!existing) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Recovered: the full cross-platform health matrix is passing again.\n\nRun: ${runUrl}`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed'
            });
