name: One-time palette standards reconciliation v33

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-standards-palette-v33.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile palette wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SITE_STANDARDS.md')
          s=p.read_text()
          old='The visual aesthetic is a protected system: dark blue/black animated background, blue identity accents, green progress/completed states, red estreno states, white estreno text, glass cards, responsive typography and existing spacing/radius hierarchy.'
          new='The visual aesthetic is a protected system: dark blue/black animated background, blue identity accents, the documented red → orange → amber → green preparation progression, gold estreno states, glass cards, responsive typography and existing spacing/radius hierarchy.'
          if old not in s:
              raise SystemExit('Expected legacy palette sentence not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit standards reconciliation
        run: |
          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add SITE_STANDARDS.md
          git commit -m "Reconcile standards with new preparation palette"
          git push origin main
