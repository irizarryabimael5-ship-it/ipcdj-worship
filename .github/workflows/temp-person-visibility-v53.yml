name: One-time person visibility v53

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-person-visibility-v53.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase subject visibility without restoring seam
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          if 'content="eraser-feather-v52"' not in s:
              raise SystemExit('expected v52 build marker not found')
          s=s.replace('content="eraser-feather-v52"','content="person-visibility-v53"',1)

          start=s.index('    .current .cover-subject-detail{', s.index('.current .cover-edge-detail::after'))
          end=s.index('    .current .countdown-wrap,', start)
          block=s[start:end]

          block=block.replace(
            'filter:brightness(.97) saturate(1.10) contrast(1.04);\n      -webkit-filter:brightness(.97) saturate(1.10) contrast(1.04);',
            'filter:brightness(1.02) saturate(1.12) contrast(1.05);\n      -webkit-filter:brightness(1.02) saturate(1.12) contrast(1.05);'
          )

          old_mask=r'''      /\* Eraser-style blend:.*?      mask-repeat:no-repeat;'''
          new_mask='''      /* Keep the v52 eraser-style seam, but let the person recover sooner.
         The transition still starts fully erased and remains gradual so no cut line returns. */
      -webkit-mask-image:linear-gradient(90deg,
        transparent 0%,
        transparent 8%,
        rgba(0,0,0,.04) 16%,
        rgba(0,0,0,.10) 24%,
        rgba(0,0,0,.20) 33%,
        rgba(0,0,0,.34) 43%,
        rgba(0,0,0,.52) 54%,
        rgba(0,0,0,.70) 65%,
        rgba(0,0,0,.84) 75%,
        rgba(0,0,0,.93) 84%,
        #000 92%,
        #000 100%);
      mask-image:linear-gradient(90deg,
        transparent 0%,
        transparent 8%,
        rgba(0,0,0,.04) 16%,
        rgba(0,0,0,.10) 24%,
        rgba(0,0,0,.20) 33%,
        rgba(0,0,0,.34) 43%,
        rgba(0,0,0,.52) 54%,
        rgba(0,0,0,.70) 65%,
        rgba(0,0,0,.84) 75%,
        rgba(0,0,0,.93) 84%,
        #000 92%,
        #000 100%);
      -webkit-mask-mode:alpha;
      mask-mode:alpha;
      -webkit-mask-repeat:no-repeat;
      mask-repeat:no-repeat;'''
          block,n=re.subn(old_mask,new_mask,block,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('desktop v52 mask block not found')
          s=s[:start]+block+s[end:]

          media=s.index('@media (max-width:640px)', end)
          mstart=s.index('      .current .cover-subject-detail{', media)
          mend=s.index('      .current .cover-edge-detail{', mstart)
          mblock=s[mstart:mend]
          mblock=mblock.replace(
            'filter:brightness(.97) saturate(1.08) contrast(1.03);\n        -webkit-filter:brightness(.97) saturate(1.08) contrast(1.03);',
            'filter:brightness(1.03) saturate(1.13) contrast(1.05);\n        -webkit-filter:brightness(1.03) saturate(1.13) contrast(1.05);'
          )
          mblock,n=re.subn(
            r'''        -webkit-mask-image:linear-gradient\(90deg,.*?        mask-repeat:no-repeat;''',
            '''        -webkit-mask-image:linear-gradient(90deg,
          transparent 0%,
          transparent 7%,
          rgba(0,0,0,.05) 14%,
          rgba(0,0,0,.12) 22%,
          rgba(0,0,0,.24) 31%,
          rgba(0,0,0,.40) 41%,
          rgba(0,0,0,.58) 52%,
          rgba(0,0,0,.75) 63%,
          rgba(0,0,0,.87) 74%,
          rgba(0,0,0,.95) 84%,
          #000 91%,
          #000 100%);
        mask-image:linear-gradient(90deg,
          transparent 0%,
          transparent 7%,
          rgba(0,0,0,.05) 14%,
          rgba(0,0,0,.12) 22%,
          rgba(0,0,0,.24) 31%,
          rgba(0,0,0,.40) 41%,
          rgba(0,0,0,.58) 52%,
          rgba(0,0,0,.75) 63%,
          rgba(0,0,0,.87) 74%,
          rgba(0,0,0,.95) 84%,
          #000 91%,
          #000 100%);
        -webkit-mask-mode:alpha;
        mask-mode:alpha;
        -webkit-mask-repeat:no-repeat;
        mask-repeat:no-repeat;''',
            mblock,count=1,flags=re.S
          )
          if n!=1:
              raise SystemExit('mobile v52 mask block not found')
          s=s[:mstart]+mblock+s[mend:]
          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text()
          if 'const CACHE_NAME = "ipcdj-worship-v52";' not in t:
              raise SystemExit('expected v52 sw marker not found')
          sw.write_text(t.replace('const CACHE_NAME = "ipcdj-worship-v52";','const CACHE_NAME = "ipcdj-worship-v53";',1))

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          note='''

## Person visibility balance v53

After the eraser-style seam treatment, the isolated person should remain clearly readable. Preserve the long transparent-to-opaque blend that removes the cut line, but let opacity recover somewhat earlier through the middle and right side of the subject region. Slightly harmonize brightness, saturation, and contrast so the person has presence without looking pasted on. Mobile may recover a little earlier than desktop while retaining the same seamless edge principle.
'''
          if '## Person visibility balance v53' not in u:
              st.write_text(u+note)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Bring subject back while preserving seamless blend"
          git push origin main
