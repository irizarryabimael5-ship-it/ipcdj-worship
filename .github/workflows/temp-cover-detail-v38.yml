name: One-time cover detail v38

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-cover-detail-v38.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine selective album-art visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('content="cover-detail-v37"','content="cover-detail-v38"',1)

          old='''    .current .cover-detail{\n      position:absolute;\n      inset:-2px;\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:cover;\n      background-position:center;\n      background-repeat:no-repeat;\n      filter:blur(4px) saturate(1.08) contrast(1.03);\n      -webkit-filter:blur(4px) saturate(1.08) contrast(1.03);\n      opacity:.30;\n      transform:scale(1.035);\n      -webkit-mask-image:\n        radial-gradient(ellipse 34% 26% at 88% 16%, #000 0%, rgba(0,0,0,.88) 32%, rgba(0,0,0,.38) 62%, transparent 100%),\n        radial-gradient(ellipse 26% 22% at 10% 90%, #000 0%, rgba(0,0,0,.70) 36%, transparent 100%);\n      mask-image:\n        radial-gradient(ellipse 34% 26% at 88% 16%, #000 0%, rgba(0,0,0,.88) 32%, rgba(0,0,0,.38) 62%, transparent 100%),\n        radial-gradient(ellipse 26% 22% at 10% 90%, #000 0%, rgba(0,0,0,.70) 36%, transparent 100%);\n      -webkit-mask-composite:source-over;\n      mask-composite:add;\n      transition:opacity .9s ease;\n    }\n\n    @media (max-width:640px){\n      .current .cover-detail{\n        opacity:.22;\n        background-position:58% center;\n        -webkit-mask-image:\n          radial-gradient(ellipse 30% 18% at 90% 10%, #000 0%, rgba(0,0,0,.70) 34%, transparent 100%),\n          radial-gradient(ellipse 24% 16% at 8% 94%, #000 0%, rgba(0,0,0,.55) 34%, transparent 100%);\n        mask-image:\n          radial-gradient(ellipse 30% 18% at 90% 10%, #000 0%, rgba(0,0,0,.70) 34%, transparent 100%),\n          radial-gradient(ellipse 24% 16% at 8% 94%, #000 0%, rgba(0,0,0,.55) 34%, transparent 100%);\n      }\n    }\n\n    @media (prefers-reduced-transparency: reduce){\n      .current .cover-detail{opacity:.12}\n    }'''

          new='''    .current .cover-detail{\n      position:absolute;\n      inset:-4px;\n      z-index:0;\n      pointer-events:none;\n      background-image:var(--cover-image);\n      background-size:cover;\n      background-position:center;\n      background-repeat:no-repeat;\n      filter:blur(2.6px) saturate(1.10) contrast(1.04);\n      -webkit-filter:blur(2.6px) saturate(1.10) contrast(1.04);\n      opacity:.42;\n      transform:scale(1.025);\n      -webkit-mask-image:\n        radial-gradient(ellipse 38% 28% at 90% 13%, #000 0%, rgba(0,0,0,.92) 34%, rgba(0,0,0,.52) 67%, transparent 100%),\n        radial-gradient(ellipse 28% 20% at 10% 12%, #000 0%, rgba(0,0,0,.72) 40%, transparent 100%),\n        radial-gradient(ellipse 30% 18% at 90% 48%, #000 0%, rgba(0,0,0,.68) 38%, transparent 100%),\n        radial-gradient(ellipse 34% 20% at 9% 53%, #000 0%, rgba(0,0,0,.64) 38%, transparent 100%),\n        radial-gradient(ellipse 36% 24% at 88% 88%, #000 0%, rgba(0,0,0,.76) 38%, transparent 100%),\n        radial-gradient(ellipse 30% 22% at 10% 91%, #000 0%, rgba(0,0,0,.72) 38%, transparent 100%),\n        linear-gradient(90deg, rgba(0,0,0,.54) 0 7%, transparent 15% 85%, rgba(0,0,0,.54) 93% 100%);\n      mask-image:\n        radial-gradient(ellipse 38% 28% at 90% 13%, #000 0%, rgba(0,0,0,.92) 34%, rgba(0,0,0,.52) 67%, transparent 100%),\n        radial-gradient(ellipse 28% 20% at 10% 12%, #000 0%, rgba(0,0,0,.72) 40%, transparent 100%),\n        radial-gradient(ellipse 30% 18% at 90% 48%, #000 0%, rgba(0,0,0,.68) 38%, transparent 100%),\n        radial-gradient(ellipse 34% 20% at 9% 53%, #000 0%, rgba(0,0,0,.64) 38%, transparent 100%),\n        radial-gradient(ellipse 36% 24% at 88% 88%, #000 0%, rgba(0,0,0,.76) 38%, transparent 100%),\n        radial-gradient(ellipse 30% 22% at 10% 91%, #000 0%, rgba(0,0,0,.72) 38%, transparent 100%),\n        linear-gradient(90deg, rgba(0,0,0,.54) 0 7%, transparent 15% 85%, rgba(0,0,0,.54) 93% 100%);\n      -webkit-mask-composite:source-over;\n      mask-composite:add;\n      transition:opacity .9s ease;\n    }\n\n    .current .countdown-wrap,\n    .current .progress-wrap,\n    .current .timeline-item{\n      background-color:rgba(7,10,16,.34);\n      backdrop-filter:blur(3px) saturate(1.04);\n      -webkit-backdrop-filter:blur(3px) saturate(1.04);\n    }\n\n    .current .countdown-unit{\n      background:rgba(7,10,16,.30);\n    }\n\n    .current .timeline-item:not(.active-phase):not(.estreno){\n      background:linear-gradient(90deg,rgba(var(--cover-c1),.035),rgba(7,10,16,.26),rgba(var(--cover-c2),.018));\n    }\n\n    @media (max-width:640px){\n      .current .cover-detail{\n        opacity:.31;\n        background-position:58% center;\n        -webkit-mask-image:\n          radial-gradient(ellipse 31% 17% at 91% 9%, #000 0%, rgba(0,0,0,.78) 34%, transparent 100%),\n          radial-gradient(ellipse 25% 15% at 8% 12%, #000 0%, rgba(0,0,0,.58) 36%, transparent 100%),\n          radial-gradient(ellipse 26% 15% at 92% 52%, #000 0%, rgba(0,0,0,.56) 36%, transparent 100%),\n          radial-gradient(ellipse 27% 16% at 8% 57%, #000 0%, rgba(0,0,0,.52) 36%, transparent 100%),\n          radial-gradient(ellipse 30% 18% at 90% 92%, #000 0%, rgba(0,0,0,.66) 34%, transparent 100%),\n          radial-gradient(ellipse 24% 17% at 8% 94%, #000 0%, rgba(0,0,0,.58) 34%, transparent 100%);\n        mask-image:\n          radial-gradient(ellipse 31% 17% at 91% 9%, #000 0%, rgba(0,0,0,.78) 34%, transparent 100%),\n          radial-gradient(ellipse 25% 15% at 8% 12%, #000 0%, rgba(0,0,0,.58) 36%, transparent 100%),\n          radial-gradient(ellipse 26% 15% at 92% 52%, #000 0%, rgba(0,0,0,.56) 36%, transparent 100%),\n          radial-gradient(ellipse 27% 16% at 8% 57%, #000 0%, rgba(0,0,0,.52) 36%, transparent 100%),\n          radial-gradient(ellipse 30% 18% at 90% 92%, #000 0%, rgba(0,0,0,.66) 34%, transparent 100%),\n          radial-gradient(ellipse 24% 17% at 8% 94%, #000 0%, rgba(0,0,0,.58) 34%, transparent 100%);\n      }\n    }\n\n    @media (prefers-reduced-transparency: reduce){\n      .current .cover-detail{opacity:.14}\n      .current .countdown-wrap,\n      .current .progress-wrap,\n      .current .timeline-item{backdrop-filter:none;-webkit-backdrop-filter:none}\n    }'''

          if old not in s: raise SystemExit('v37 cover detail block not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text().replace('const CACHE_NAME = "ipcdj-worship-v37";','const CACHE_NAME = "ipcdj-worship-v38";',1)
          sw.write_text(t)

          st=Path('SITE_STANDARDS.md')
          u=st.read_text()
          block='''\n\n## Dense but non-distracting album-art presence\n\nThe active-song card should make meaningful use of nearly every area that is not occupied by text, without allowing album art to compete with content.\n\nRequired behavior:\n- Preserve the heavily blurred full-card artwork layer as the base atmosphere.\n- Use a second lightly blurred detail layer with multiple feathered reveal zones around corners, side gutters and low-content bands.\n- Favor empty margins, outer edges, gaps between content groups and unused portions of nested panels.\n- Do not deliberately reveal high-detail imagery directly beneath the song title, artist, countdown labels/numbers, progress labels or timeline text.\n- Nested panels inside the current-song card should remain translucent enough for the artwork atmosphere to pass through, with only mild local blur for readability.\n- Desktop can show more recognizable cover detail than mobile; narrow layouts must use lower opacity and tighter reveal zones.\n- The result should be clearly noticeable at a glance but never become a crisp full-cover background.\n- Semantic stage colors and the page-wide animated ambient background remain independent and unchanged.\n'''
          if '## Dense but non-distracting album-art presence' not in u:
              u += block
          st.write_text(u)
          PY

          git config user.name "IPCDJ Worship Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js SITE_STANDARDS.md
          git commit -m "Increase strategic album-art presence in empty card space"
          git push origin main
